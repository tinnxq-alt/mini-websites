name: Remove picker numbers v44

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-picker-numbers-v44.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove numeric prefixes from rolling picker groups
        shell: python
        run: |
          from pathlib import Path

          p=Path('xizong-study/integrated-runtime.js')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ("label:'1. 病理 + 生理 + 内科'","label:'病理 + 生理 + 内科'"),
            ("label:'2. 外科'","label:'外科'"),
            ("label:'3. 生化'","label:'生化'"),
          ]
          for old,new in pairs:
              assert old in s, f'missing {old}'
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('xizong-study/index.html')
          s=p.read_text(encoding='utf-8').replace('integrated-runtime.js?v=43','integrated-runtime.js?v=44')
          p.write_text(s,encoding='utf-8')

          p=Path('xizong-study/sw.js')
          s=p.read_text(encoding='utf-8').replace('xizong-study-v43-20260830','xizong-study-v44-20260830').replace('integrated-runtime.js?v=43','integrated-runtime.js?v=44')
          p.write_text(s,encoding='utf-8')

      - name: Validate
        run: |
          node --check xizong-study/integrated-runtime.js
          grep -q "label:'病理 + 生理 + 内科'" xizong-study/integrated-runtime.js
          grep -q "label:'外科'" xizong-study/integrated-runtime.js
          grep -q "label:'生化'" xizong-study/integrated-runtime.js
          ! grep -q "label:'1. 病理 + 生理 + 内科'" xizong-study/integrated-runtime.js
          ! grep -q "label:'2. 外科'" xizong-study/integrated-runtime.js
          ! grep -q "label:'3. 生化'" xizong-study/integrated-runtime.js
          grep -q 'integrated-runtime.js?v=44' xizong-study/index.html
          grep -q 'xizong-study-v44-20260830' xizong-study/sw.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/integrated-runtime.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Remove rolling picker numeric prefixes"
          git push
