name: Confirm rolling delete v48

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/confirm-rolling-delete-v48.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v48 rolling delete confirmation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          runtime = Path('xizong-study/integrated-runtime.js')
          s = runtime.read_text()
          old = "function deleteRollingProject(id){const state=read(),item=findItem(state,id);if(!item)return;state.rollingReviews="
          new = "function deleteRollingProject(id){const state=read(),item=findItem(state,id);if(!item)return;if(!confirm(`删除这条滚动复习？\\n${item.name}`))return;state.rollingReviews="
          if old not in s:
              raise SystemExit('runtime delete function pattern not found')
          s = s.replace(old, new, 1)
          runtime.write_text(s)

          app = Path('xizong-study/app.js')
          a = app.read_text()
          old = "if(a==='rolling-delete'){const r=state.rollingReviews.find(x=>x.id===id);if(r&&confirm(`删除“${r.name}”的滚动复习？`)){"
          new = "if(a==='rolling-delete'){const r=state.rollingReviews.find(x=>x.id===id);if(r&&confirm(`删除这条滚动复习？\\n${r.name}`)){"
          if old not in a:
              raise SystemExit('core rolling delete confirmation pattern not found')
          a = a.replace(old, new, 1)
          app.write_text(a)

          index = Path('xizong-study/index.html')
          h = index.read_text().replace('integrated-runtime.js?v=47','integrated-runtime.js?v=48').replace('app.js?v=46','app.js?v=48')
          index.write_text(h)

          sw = Path('xizong-study/sw.js')
          w = sw.read_text().replace('xizong-study-v47-20260830','xizong-study-v48-20260830').replace('integrated-runtime.js?v=47','integrated-runtime.js?v=48').replace('app.js?v=46','app.js?v=48')
          sw.write_text(w)

          quality = Path('.github/workflows/quality.yml')
          q = quality.read_text()
          q = q.replace("          grep -Fq '导出学习记录 CSV' xizong-study/integrated-runtime.js\n", "          grep -Fq '导出学习记录 CSV' xizong-study/integrated-runtime.js\n          grep -Fq '删除这条滚动复习？' xizong-study/integrated-runtime.js\n          grep -Fq '删除这条滚动复习？' xizong-study/app.js\n")
          q = q.replace("integrated-runtime.js?v=47", "integrated-runtime.js?v=48").replace("app.js?v=46", "app.js?v=48").replace("xizong-study-v47-20260830", "xizong-study-v48-20260830")
          quality.write_text(q)

          subprocess.run(['node','--check','xizong-study/integrated-runtime.js'], check=True)
          subprocess.run(['node','--check','xizong-study/app.js'], check=True)
          assert s.count('删除这条滚动复习？') >= 1
          assert a.count('删除这条滚动复习？') >= 1
          assert 'integrated-runtime.js?v=48' in h and 'app.js?v=48' in h
          assert 'xizong-study-v48-20260830' in w
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add xizong-study/integrated-runtime.js xizong-study/app.js xizong-study/index.html xizong-study/sw.js .github/workflows/quality.yml
          git diff --cached --quiet && exit 0
          git commit -m "Confirm all rolling review deletions"
          git push
