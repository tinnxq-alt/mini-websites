name: Finalize Xizong v45 quality

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v45.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update permanent quality guards
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/quality.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('integrated-runtime.js?v=44','integrated-runtime.js?v=45')
          s=s.replace('app.js?v=40','app.js?v=45')
          s=s.replace('xizong-study-v44-20260830','xizong-study-v45-20260830')
          marker='          grep -q "text:\'已完成\',cls:\'done\'" xizong-study/integrated-runtime.js\n'
          extra='''          grep -Fq "window.__xizongRollingCatalog=CATALOG" xizong-study/integrated-runtime.js
          grep -Fq "const ROLLING_CATALOG=window.__xizongRollingCatalog||[]" xizong-study/app.js
          grep -Fq "window.__xizongRender" xizong-study/app.js
          grep -Fq "function commitState" xizong-study/integrated-runtime.js
          grep -Fq "correctRaw===''" xizong-study/app.js
          grep -Fq "...n,index:" xizong-study/app.js
          ! grep -Fq "location.reload()" xizong-study/integrated-runtime.js
          ! grep -Fq "const ROLLING_CATALOG=[" xizong-study/app.js
          ! grep -Fq '<input id="importFile" class="hidden" type="file" accept="application/json">' xizong-study/app.js
          [ "$(grep -o 'id="importFile"' xizong-study/index.html | wc -l)" -eq 1 ]
'''
          assert marker in s, 'quality insertion marker missing'
          s=s.replace(marker,marker+extra,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate quality file
        run: |
          grep -q 'integrated-runtime.js?v=45' .github/workflows/quality.yml
          grep -q 'app.js?v=45' .github/workflows/quality.yml
          grep -q 'xizong-study-v45-20260830' .github/workflows/quality.yml
          grep -q 'location.reload()' .github/workflows/quality.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality.yml
          git commit -m "Update quality guards for v45 optimization"
          git push
