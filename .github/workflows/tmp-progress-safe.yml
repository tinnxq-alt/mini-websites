name: Apply Xizong progress safety patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-progress-safe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/patch_progress.py
      - name: Verify JavaScript
        run: |
          node --check xizong-study/app.js
          grep -q "save-subjects" xizong-study/app.js
          grep -q "一次只修改一科" xizong-study/app.js
          grep -q "edit-progress" xizong-study/app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/app.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Separate subject and progress saves with safe editing"
          git push origin main
