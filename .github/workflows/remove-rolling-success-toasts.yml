name: Remove rolling review success toasts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-rolling-success-toasts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove remaining rolling success messages
        shell: python
        run: |
          from pathlib import Path
          for file in ['xizong-study/app.js','xizong-study/integrated-runtime.js']:
            p=Path(file); s=p.read_text(encoding='utf-8')
            for old in [
              ";toast('滚动复习已完成')",
              ";toast('已顺延 1 天')",
              ";toast('已跳过本轮')",
              ";toast('已删除')",
              ";toast('已加入滚动复习')",
            ]:
              s=s.replace(old,'')
            p.write_text(s,encoding='utf-8')
          p=Path('xizong-study/index.html')
          s=p.read_text(encoding='utf-8').replace('integrated-runtime.js?v=31','integrated-runtime.js?v=32').replace('app.js?v=31','app.js?v=32')
          p.write_text(s,encoding='utf-8')
          p=Path('xizong-study/sw.js')
          s=p.read_text(encoding='utf-8').replace('xizong-study-v31-20260830','xizong-study-v32-20260830').replace('integrated-runtime.js?v=31','integrated-runtime.js?v=32').replace('app.js?v=31','app.js?v=32')
          p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: |
          node --check xizong-study/app.js
          node --check xizong-study/integrated-runtime.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/app.js xizong-study/integrated-runtime.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Remove rolling review success messages"
          git push
