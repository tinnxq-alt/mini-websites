name: Optimize rolling review picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-optimize-rolling-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Optimize rolling review picker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # app.js
          p=Path('xizong-study/app.js')
          s=p.read_text()
          s=s.replace("const V=16,", "const V=17,", 1)
          old="""function openRollingAdd(){const sel=$('#rollPreset');sel.innerHTML=ROLLING_CATALOG.map(x=>`<option value=\"${x.id}\">${esc(x.group)} · ${esc(x.name)}</option>`).join('');$('#rollCustomName').value='';$('#rollSubject').innerHTML=[...SUB,'综合'].map(x=>`<option>${x}</option>`).join('');$('#rollStart').value=today();$('#rollingDialog').showModal()}"""
          new="""function rollingCatalogSubjects(){return [...new Set(ROLLING_CATALOG.map(x=>x.subject))]}
function syncRollingPreview(){const p=ROLLING_CATALOG.find(x=>x.id===$('#rollPreset')?.value),box=$('#rollPresetPreview');if(!box)return;box.innerHTML=p?`<div class=\"small muted\">已选章节</div><b>${esc(p.name)}</b><div class=\"small muted\" style=\"margin-top:4px\">${esc(p.subject)} · ${esc(p.group)}</div>`:'<span class=\"small muted\">当前没有可选章节</span>'}
function syncRollingPresets(){const subject=$('#rollCatalogSubject')?.value,group=$('#rollGroup')?.value,sel=$('#rollPreset');if(!sel)return;const items=ROLLING_CATALOG.filter(x=>x.subject===subject&&x.group===group);sel.innerHTML=items.map(x=>`<option value=\"${x.id}\">${esc(x.name)}</option>`).join('');syncRollingPreview()}
function syncRollingGroups(){const subject=$('#rollCatalogSubject')?.value,sel=$('#rollGroup');if(!sel)return;const groups=[...new Set(ROLLING_CATALOG.filter(x=>x.subject===subject).map(x=>x.group))];sel.innerHTML=groups.map(x=>`<option>${esc(x)}</option>`).join('');syncRollingPresets()}
function setRollingMode(mode='preset'){const custom=mode==='custom';$('#rollMode').value=custom?'custom':'preset';$('#rollPresetPanel').classList.toggle('hidden',custom);$('#rollCustomPanel').classList.toggle('hidden',!custom);$$('.roll-mode').forEach(b=>b.classList.toggle('active',b.dataset.rollMode===(custom?'custom':'preset')))}
function openRollingAdd(){const subjects=rollingCatalogSubjects(),subjectSel=$('#rollCatalogSubject');subjectSel.innerHTML=subjects.map(x=>`<option>${esc(x)}</option>`).join('');const preferred=activeSubjects().find(x=>subjects.includes(x))||subjects[0];if(preferred)subjectSel.value=preferred;syncRollingGroups();$('#rollCustomName').value='';$('#rollSubject').innerHTML=[...SUB,'综合'].map(x=>`<option>${x}</option>`).join('');$('#rollStart').value=today();setRollingMode('preset');$('#rollingDialog').showModal()}"""
          if old not in s:
              raise SystemExit('openRollingAdd source not found')
          s=s.replace(old,new,1)

          old="""const b=e.target.closest('[data-a]');if(!b)return;"""
          new="""const rm=e.target.closest('[data-roll-mode]');if(rm){setRollingMode(rm.dataset.rollMode);return}const b=e.target.closest('[data-a]');if(!b)return;"""
          if old not in s:
              raise SystemExit('click delegation source not found')
          s=s.replace(old,new,1)

          old="""$('#rollingForm').addEventListener('submit',e=>{e.preventDefault();const custom=$('#rollCustomName').value.trim(),preset=ROLLING_CATALOG.find(x=>x.id===$('#rollPreset').value),name=custom||preset?.name,subject=custom?$('#rollSubject').value:(preset?.subject||'综合'),group=custom?'自定义':(preset?.group||'自定义'),startDate=$('#rollStart').value||today();if(!name)return toast('请选择预置章节或填写自定义内容');if(state.rollingReviews.some(r=>r.name===name&&r.subject===subject&&!r.paused))return toast('这个内容已经在滚动复习中');state.rollingReviews.push({id:uid(),name,subject,group,source:custom?'custom':'preset',startDate,intervals:[...ROLLING_INTERVALS],nodes:makeRollingNodes(startDate),paused:false,createdAt:new Date().toISOString()});save();$('#rollingDialog').close();render();toast('已加入滚动复习')});"""
          new="""$('#rollingForm').addEventListener('submit',e=>{e.preventDefault();const mode=$('#rollMode').value==='custom'?'custom':'preset',custom=$('#rollCustomName').value.trim(),preset=ROLLING_CATALOG.find(x=>x.id===$('#rollPreset').value),name=mode==='custom'?custom:preset?.name,subject=mode==='custom'?$('#rollSubject').value:(preset?.subject||'综合'),group=mode==='custom'?'自定义':(preset?.group||'自定义'),startDate=$('#rollStart').value||today();if(!name)return toast(mode==='custom'?'请输入自定义复习内容':'请选择一个章节');const duplicate=state.rollingReviews.some(r=>r.name===name&&r.subject===subject&&r.nodes.some(n=>n.status==='pending'));if(duplicate)return toast('这个内容已经在滚动复习中');state.rollingReviews.push({id:uid(),name,subject,group,source:mode,startDate,intervals:[...ROLLING_INTERVALS],nodes:makeRollingNodes(startDate),paused:false,createdAt:new Date().toISOString()});save();$('#rollingDialog').close();render();toast('已加入滚动复习')});"""
          if old not in s:
              raise SystemExit('rollingForm source not found')
          s=s.replace(old,new,1)

          old="""document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0])importData(e.target.files[0])});"""
          new="""document.addEventListener('change',e=>{if(e.target.id==='rollCatalogSubject')syncRollingGroups();if(e.target.id==='rollGroup')syncRollingPresets();if(e.target.id==='rollPreset')syncRollingPreview();if(e.target.id==='importFile'&&e.target.files[0])importData(e.target.files[0])});"""
          if old not in s:
              raise SystemExit('change handler source not found')
          s=s.replace(old,new,1)
          s=s.replace('PWA v16','PWA v17')
          p.write_text(s)

          # index.html
          p=Path('xizong-study/index.html')
          s=p.read_text()
          old='''<dialog id="rollingDialog" class="sheet"><form id="rollingForm" class="sheetin">\n<div class="handle"></div><div class="sheethead"><div><div class="small muted">间隔复习</div><h3>添加滚动复习</h3></div><button type="button" id="closeRolling" class="iconbtn">×</button></div>\n<label>从预置章节选择<select id="rollPreset"></select></label>\n<div class="small muted" style="text-align:center;margin:-4px 0 10px">或</div>\n<label>自定义内容<input id="rollCustomName" placeholder="例如：呼吸系统薄弱专题"></label>\n<label>自定义所属学科<select id="rollSubject"></select></label>\n<label>学习完成日期<input id="rollStart" type="date" required></label>\n<div class="callout">加入后按 1 / 3 / 7 / 15 / 30 天自动生成复习节点。每个人从自己的完成日期开始，不统一推送进度。</div>\n<button class="btn primary" type="submit">加入滚动复习</button>\n</form></dialog>'''
          new='''<dialog id="rollingDialog" class="sheet"><form id="rollingForm" class="sheetin rolling-sheet">\n<div class="handle"></div><div class="sheethead"><div><div class="small muted">间隔复习</div><h3>添加滚动复习</h3></div><button type="button" id="closeRolling" class="iconbtn">×</button></div>\n<input id="rollMode" type="hidden" value="preset">\n<div class="roll-mode-switch"><button type="button" class="roll-mode active" data-roll-mode="preset">从目录选择</button><button type="button" class="roll-mode" data-roll-mode="custom">自定义</button></div>\n<div id="rollPresetPanel">\n<div class="roll-step"><span>1</span><label>选择学科<select id="rollCatalogSubject"></select></label></div>\n<div class="roll-step"><span>2</span><label>选择系统<select id="rollGroup"></select></label></div>\n<div class="roll-step"><span>3</span><label>选择章节<select id="rollPreset"></select></label></div>\n<div id="rollPresetPreview" class="roll-preview"></div>\n</div>\n<div id="rollCustomPanel" class="hidden">\n<label>复习内容<input id="rollCustomName" placeholder="例如：呼吸系统薄弱专题"></label>\n<label>所属学科<select id="rollSubject"></select></label>\n</div>\n<label>本轮学习完成日期<input id="rollStart" type="date" required></label>\n<div class="callout">系统会从这个完成日期开始，自动安排第 1 / 3 / 7 / 15 / 30 天复习。不同人的进度彼此独立。</div>\n<button class="btn primary" type="submit">加入滚动复习</button>\n</form></dialog>'''
          if old not in s:
              raise SystemExit('rolling dialog source not found')
          s=s.replace(old,new,1)
          s=s.replace('?v=16','?v=17')
          p.write_text(s)

          # styles.css
          p=Path('xizong-study/styles.css')
          s=p.read_text()
          extra='''.rolling-sheet{max-height:90vh;overflow-y:auto}.roll-mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:4px;background:#f0f4f1;border-radius:15px;margin-bottom:15px}.roll-mode{border:0;border-radius:12px;min-height:42px;background:transparent;color:var(--muted);font-weight:700}.roll-mode.active{background:#fff;color:var(--p);box-shadow:0 3px 10px rgba(40,70,55,.08)}.roll-step{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start}.roll-step>span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ps);color:var(--p);font-size:12px;font-weight:800;margin-top:24px}.roll-step label{margin-bottom:10px}.roll-preview{border:1px solid #d5e5dc;background:#f7fbf8;border-radius:15px;padding:12px 13px;margin:3px 0 14px}.roll-preview b{display:block;line-height:1.5;margin-top:3px}.rolling-sheet .callout{margin-top:4px}@media(max-width:380px){.rolling-sheet{padding-left:15px;padding-right:15px}.roll-step{grid-template-columns:26px 1fr}.roll-step>span{width:23px;height:23px}}'''
          if extra not in s:
              s += '\n' + extra + '\n'
          p.write_text(s)

          # sw.js
          p=Path('xizong-study/sw.js')
          s=p.read_text().replace('xizong-study-v16-20260830','xizong-study-v17-20260830').replace('?v=16','?v=17')
          p.write_text(s)
          PY
          node --check xizong-study/app.js
          grep -q "rollCatalogSubject" xizong-study/index.html
          grep -q "syncRollingGroups" xizong-study/app.js
          grep -q "data-roll-mode" xizong-study/index.html
          grep -q "xizong-study-v17-20260830" xizong-study/sw.js
      - name: Commit optimized picker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/app.js xizong-study/index.html xizong-study/styles.css xizong-study/sw.js
          git commit -m "Optimize rolling review chapter picker"
          git push origin main
