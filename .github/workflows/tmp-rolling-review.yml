name: Apply rolling review upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-rolling-review.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Upgrade Xizong rolling review
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('xizong-study/app.js')
          s=p.read_text()
          s=s.replace("const V=15,SUB=", "const V=16,SUB=", 1)

          catalog="""const ROLLING_INTERVALS=[1,3,7,15,30];
          const ROLLING_CATALOG=[
          ['生理','血液','跨膜转运、细胞电活动、骨骼肌收缩①'],['生理','血液','骨骼肌收缩②、心肌电活动'],['生理','血液','细胞信号转导'],['生理','血液','血型、血液特性、生理止血'],['内科','血液','缺铁性贫血、再障、溶血性贫血'],['内科','血液','出血性疾病、淋巴瘤'],['内科','血液','白血病、MDS'],
          ['内科','循环','骨髓瘤、心脏杂音、血压①'],['生理','循环','血压②、微循环和冠脉循环、心血管调节①'],['综合','循环','心血管调节②、心肌疾病'],['综合','循环','感染性心内膜炎、心包疾病'],['综合','循环','高血压、风湿病、动脉粥样硬化'],['内科','循环','瓣膜疾病'],['内科','循环','冠心病'],['内科','循环','心律失常①'],['内科','循环','心律失常②'],['内科','循环','收缩性心衰、心脏骤停'],
          ['综合','消化','消化概述、口腔/食管消化、胃内消化；胃炎、消化性溃疡'],['内科','消化','胃炎、胃食管反流、消化性溃疡'],['综合','消化','肠内消化、肠内吸收；肠结核、炎症性肠病、肠易激'],['综合','消化','病毒性肝炎、肝硬化、消化道肿瘤、肝性脑病'],['综合','消化','消化道肿瘤、原发性肝癌、肝硬化'],['综合','消化','胰腺、胰腺炎'],
          ['综合','泌尿','肾小球滤过、泌尿总论'],['内科','泌尿','原发性肾小球疾病①'],['综合','泌尿','原发性肾小球疾病②、小管重吸收和分泌'],['内科','泌尿','中毒、尿路感染、肾衰竭'],
          ['生理','呼吸','通气功能评价、肺通气、肺换气、呼吸调节'],['病理','呼吸','慢支、肺气肿、肺心病、硅肺'],['内科','呼吸','COPD、肺动脉高压'],['综合','呼吸','支气管肺炎、肺栓塞、间质肺疾病、支扩、急性肺脓肿'],['综合','呼吸','肺炎、肺结核'],['内科','呼吸','肺结核、ARDS、呼衰'],['综合','呼吸','胸膜疾病、肺癌'],
          ['综合','内分泌','内分泌概述、钙调节激素、甲状腺激素、内分泌病理'],['内科','内分泌','内分泌总论、Graves病、甲减'],['综合','内分泌','胰岛素、糖尿病'],['综合','内分泌','生长激素、糖皮质激素、原醛、库欣、嗜铬细胞瘤'],
          ['综合','风湿免疫','免疫性疾病、风湿总论、SLE'],['内科','风湿免疫','类风湿关节炎、原发性干燥综合征、系统性血管炎'],
          ['生理','其他基础','绪论、视觉、听觉、其他感觉、能量代谢与体温'],['生理','其他基础','神经元、突触传递、递质和受体、神经调控躯体运动①'],['生理','其他基础','神经调控躯体运动②、脑电波、生殖①'],['综合','其他基础','生殖②、生殖系统疾病、乳腺疾病、其他传染病'],['病理','其他基础','损伤修复、适应损伤、局部血液循环'],['病理','其他基础','炎症、肿瘤'],
          ['外科','颈胸','颈部疾病、食管、乳房、胃肿瘤、腹腔感染'],['外科','腹部/泌尿外科','腹部损伤、肠梗阻、阑尾炎、大肠癌'],['外科','腹部/泌尿外科','其他大肠肛管疾病、腹外疝、细菌性肝脓肿、门脉高压'],['外科','腹部/泌尿外科','胆管疾病'],['外科','腹部/泌尿外科','胰腺肿瘤、周围血管疾病、泌外感染和肿瘤、泌外梗阻和损伤'],['外科','运动系统','运动畸形、慢性损伤、手外伤、骨关节感染、非化脓性关节炎、骨肿瘤'],['外科','运动系统','躯干骨损伤、脊髓损伤、颈腰椎退行性疾病'],['外科','运动系统','四肢骨脱位、骨折概论'],['外科','外科总论','输血、体液失衡、营养代谢、烧伤、围手术期'],['外科','外科总论','感染、麻醉、休克、其他外总'],
          ['生化','生化','糖代谢Ⅰ：无氧/有氧氧化、磷酸戊糖、糖原、糖异生'],['生化','生化','脂质与能量代谢：氧化磷酸化、胆固醇、胆汁酸、脂肪代谢'],['生化','生化','含氮代谢：氨基酸代谢、核苷酸代谢'],['生化','生化','综合代谢：氨基酸、脂蛋白、蛋白质、生物转化、维生素、胆色素'],['生化','生化','酶与核酸①：酶、核酸、DNA合成'],['生化','生化','核酸②：转录、翻译'],['生化','生化','基因调控：基因表达调控、真核基因、DNA损伤']
          ].map((x,i)=>({id:`preset-${i+1}`,subject:x[0],group:x[1],name:x[2]}));"""
          s=s.replace("const LOAD={日:{l:'轻量推进'},夜:{l:'中等强度'},下:{l:'复盘优先'},休:{l:'深度学习'}};", "const LOAD={日:{l:'轻量推进'},夜:{l:'中等强度'},下:{l:'复盘优先'},休:{l:'深度学习'}};\n"+catalog, 1)

          s=s.replace("customizedDates:{},activeTimer:null", "customizedDates:{},rollingReviews:[],activeTimer:null", 1)
          s=s.replace("s.customizedDates={...(src.customizedDates||src.customizedTaskDates||{})};", "s.customizedDates={...(src.customizedDates||src.customizedTaskDates||{})};s.rollingReviews=Array.isArray(src.rollingReviews)?src.rollingReviews.map(normalizeRollingItem):[];", 1)

          helpers="""
          function makeRollingNodes(startDate,intervals=ROLLING_INTERVALS){return intervals.map((day,i)=>({index:i+1,day,date:add(startDate,day),status:'pending',completedAt:null,minutes:0}))}
          function normalizeRollingItem(r){const startDate=r?.startDate||today(),intervals=Array.isArray(r?.intervals)&&r.intervals.length?r.intervals.map(Number):ROLLING_INTERVALS;return {id:r?.id||uid(),name:String(r?.name||'未命名复习'),subject:r?.subject||'综合',group:r?.group||'自定义',source:r?.source||'custom',startDate,intervals,nodes:Array.isArray(r?.nodes)&&r.nodes.length?r.nodes.map((n,i)=>({index:n.index||i+1,day:Number(n.day)||intervals[i]||i+1,date:n.date||add(startDate,Number(n.day)||intervals[i]||i+1),status:n.status||'pending',completedAt:n.completedAt||null,minutes:Number(n.minutes)||0})):makeRollingNodes(startDate,intervals),paused:!!r?.paused,createdAt:r?.createdAt||new Date().toISOString()}}
          """
          s=s.replace("function clone(x){return JSON.parse(JSON.stringify(x))}", "function clone(x){return JSON.parse(JSON.stringify(x))}\n"+helpers, 1)

          rolling_helpers="""
          function rollingDue(ds=today()){return state.rollingReviews.filter(r=>!r.paused).flatMap(r=>r.nodes.filter(n=>n.status==='pending'&&n.date<=ds).map(n=>({item:r,node:n}))).sort((a,b)=>a.node.date.localeCompare(b.node.date))}
          function rollingNext(r){return r.nodes.find(n=>n.status==='pending')||null}
          function rollingCompletedCount(r){return r.nodes.filter(n=>n.status==='done').length}
          function rollingTodayCard(){const due=rollingDue(),n=due.length;if(!n)return '';const names=due.slice(0,2).map(x=>`<div class="small" style="margin-top:5px">• ${esc(x.item.name)} · 第${x.node.index}轮</div>`).join('');return `<div class="section"><h2>今日滚动复习</h2><button data-view="rolling">查看全部</button></div><section class="card rolling-alert"><div class="listrow" style="padding:0;border:0"><div><b>今日到期 ${n} 项</b><div class="small muted">按个人加入日期自动滚动</div></div><span class="badge wait">${n}</span></div>${names}${n>2?`<div class="small muted" style="margin-top:6px">还有 ${n-2} 项待处理</div>`:''}</section>`}
          function rollingItemHTML(r){const nx=rollingNext(r),done=rollingCompletedCount(r);return `<div class="rolling-item"><div class="rolling-main"><b>${esc(r.name)}</b><div class="small muted">${esc(r.subject)} · ${esc(r.group)} · 已完成 ${done}/${r.nodes.length}${nx?` · 下次 ${nx.date}`:' · 已完成全部轮次'}</div></div><div class="rolling-actions"><button class="recordbtn" data-a="toggle-rolling-pause" data-id="${r.id}">${r.paused?'继续':'暂停'}</button><button class="xbtn" data-a="rolling-delete" data-id="${r.id}">×</button></div></div>`}
          function renderRolling(){const due=rollingDue(),active=[...state.rollingReviews].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')),completed=state.rollingReviews.reduce((n,r)=>n+r.nodes.filter(x=>x.status==='done').length,0);return `<div class="stats"><div class="stat"><span class="small muted">今日到期</span><b>${due.length}</b></div><div class="stat"><span class="small muted">累计完成轮次</span><b>${completed}</b></div></div><div class="section"><h2>今日到期</h2><button data-a="add-rolling">＋ 添加</button></div><section class="card">${due.length?due.map(({item,node})=>`<div class="rolling-due"><div class="rolling-main"><b>${esc(item.name)}</b><div class="small muted">${esc(item.subject)} · 第${node.index}轮 · 原定 ${node.date}</div></div><div class="rolling-due-actions"><button class="recordbtn" data-a="rolling-complete" data-id="${item.id}" data-index="${node.index}">完成</button><button class="recordbtn" data-a="rolling-delay" data-id="${item.id}" data-index="${node.index}">顺延1天</button><button class="recordbtn" data-a="rolling-skip" data-id="${item.id}" data-index="${node.index}">跳过</button></div></div>`).join(''):'<div class="empty">今天没有到期的滚动复习</div>'}</section><div class="section"><h2>已加入滚动</h2><span class="small muted">1 / 3 / 7 / 15 / 30 天</span></div><section class="card">${active.length?active.map(rollingItemHTML).join(''):'<div class="empty">还没有加入滚动复习。可以从预置章节或自定义内容开始。</div>'}</section><button class="btn primary" data-a="add-rolling">＋ 添加滚动复习</button>`}
          """
          s=s.replace("function renderWeek(ds){", rolling_helpers+"\nfunction renderWeek(ds){", 1)

          s=s.replace("</div></div><div class=\"section\"><h2>当前推进</h2>", "</div></div>${rollingTodayCard()}<div class=\"section\"><h2>当前推进</h2>", 1)
          s=s.replace("const typeName=r.type==='review'?'错题复盘':r.type==='mock'?'套卷':'学习';", "const typeName=r.type==='review'?'错题复盘':r.type==='mock'?'套卷':r.type==='rolling'?'滚动复习':'学习';", 1)
          s=s.replace("review:renderReview,me:renderMe", "rolling:renderRolling,me:renderMe", 1)
          s=s.replace("PWA v15", "PWA v16")

          rolling_actions="""
          function openRollingAdd(){const sel=$('#rollPreset');sel.innerHTML=ROLLING_CATALOG.map(x=>`<option value="${x.id}">${esc(x.group)} · ${esc(x.name)}</option>`).join('');$('#rollCustomName').value='';$('#rollSubject').innerHTML=[...SUB,'综合'].map(x=>`<option>${x}</option>`).join('');$('#rollStart').value=today();$('#rollingDialog').showModal()}
          function findRollingNode(id,index){const item=state.rollingReviews.find(r=>r.id===id);return {item,node:item?.nodes.find(n=>n.index===Number(index))}}
          function completeRolling(id,index){const {item,node}=findRollingNode(id,index);if(!item||!node)return;const raw=prompt('本次复习用时（分钟，可留空）','');if(raw===null)return;const minutes=Math.max(0,Number(raw)||0);node.status='done';node.completedAt=new Date().toISOString();node.minutes=minutes;state.records.push({id:uid(),date:today(),type:'rolling',subject:item.subject||'综合',year:null,total:0,correct:0,minutes,note:`${item.name} · 第${node.index}轮`,createdAt:new Date().toISOString(),rollingId:item.id,rollingIndex:node.index});save();render();toast('滚动复习已完成')}
          function delayRolling(id,index){const {node}=findRollingNode(id,index);if(!node)return;node.date=add(node.date,1);save();render();toast('已顺延 1 天')}
          function skipRolling(id,index){const {node}=findRollingNode(id,index);if(!node)return;node.status='skipped';node.completedAt=new Date().toISOString();save();render();toast('已跳过本轮')}
          """
          s=s.replace("function exportData(){", rolling_actions+"\nfunction exportData(){", 1)

          s=s.replace("if(a==='start-task')openTimer(id);", "if(a==='start-task')openTimer(id);if(a==='add-rolling')openRollingAdd();if(a==='rolling-complete')completeRolling(id,b.dataset.index);if(a==='rolling-delay')delayRolling(id,b.dataset.index);if(a==='rolling-skip')skipRolling(id,b.dataset.index);if(a==='toggle-rolling-pause'){const r=state.rollingReviews.find(x=>x.id===id);if(r){r.paused=!r.paused;save();render();toast(r.paused?'已暂停':'已继续')}}if(a==='rolling-delete'){const r=state.rollingReviews.find(x=>x.id===id);if(r&&confirm(`删除“${r.name}”的滚动复习？`)){state.rollingReviews=state.rollingReviews.filter(x=>x.id!==id);save();render();toast('已删除')}}", 1)

          form_listener="""
          $('#rollingForm').addEventListener('submit',e=>{e.preventDefault();const custom=$('#rollCustomName').value.trim(),preset=ROLLING_CATALOG.find(x=>x.id===$('#rollPreset').value),name=custom||preset?.name,subject=custom?$('#rollSubject').value:(preset?.subject||'综合'),group=custom?'自定义':(preset?.group||'自定义'),startDate=$('#rollStart').value||today();if(!name)return toast('请选择预置章节或填写自定义内容');if(state.rollingReviews.some(r=>r.name===name&&r.subject===subject&&!r.paused))return toast('这个内容已经在滚动复习中');state.rollingReviews.push({id:uid(),name,subject,group,source:custom?'custom':'preset',startDate,intervals:[...ROLLING_INTERVALS],nodes:makeRollingNodes(startDate),paused:false,createdAt:new Date().toISOString()});save();$('#rollingDialog').close();render();toast('已加入滚动复习')});
          """
          s=s.replace("$('#taskForm').addEventListener('submit'", form_listener+"$('#taskForm').addEventListener('submit'", 1)
          s=s.replace("$('#closeTimer').addEventListener('click'", "$('#closeRolling').addEventListener('click',()=>$('#rollingDialog').close());$('#closeTimer').addEventListener('click'", 1)

          p.write_text(s)

          p=Path('xizong-study/index.html')
          s=p.read_text()
          s=s.replace('styles.css?v=15','styles.css?v=16').replace('timer.css?v=15','timer.css?v=16').replace('app.js?v=15','app.js?v=16')
          s=s.replace('<button data-view="review"><span>↺</span><small>复盘</small></button>','<button data-view="rolling"><span>↻</span><small>滚动复习</small></button>')
          rolling_dialog='''\n<dialog id="rollingDialog" class="sheet"><form id="rollingForm" class="sheetin">\n<div class="handle"></div><div class="sheethead"><div><div class="small muted">间隔复习</div><h3>添加滚动复习</h3></div><button type="button" id="closeRolling" class="iconbtn">×</button></div>\n<label>从预置章节选择<select id="rollPreset"></select></label>\n<div class="small muted" style="text-align:center;margin:-4px 0 10px">或</div>\n<label>自定义内容<input id="rollCustomName" placeholder="例如：呼吸系统薄弱专题"></label>\n<label>自定义所属学科<select id="rollSubject"></select></label>\n<label>学习完成日期<input id="rollStart" type="date" required></label>\n<div class="callout">加入后按 1 / 3 / 7 / 15 / 30 天自动生成复习节点。每个人从自己的完成日期开始，不统一推送进度。</div>\n<button class="btn primary" type="submit">加入滚动复习</button>\n</form></dialog>\n'''
          s=s.replace('<dialog id="timerDialog" class="sheet">',rolling_dialog+'<dialog id="timerDialog" class="sheet">',1)
          p.write_text(s)

          p=Path('xizong-study/styles.css')
          s=p.read_text()+"\n.rolling-alert{border-color:#d7e6dd;background:#fbfdfb}.rolling-item,.rolling-due{padding:13px 0;border-bottom:1px solid var(--line)}.rolling-item:last-child,.rolling-due:last-child{border-bottom:0}.rolling-item{display:flex;justify-content:space-between;gap:10px;align-items:center}.rolling-main{min-width:0;flex:1}.rolling-main b{display:block;line-height:1.45}.rolling-actions{display:flex;gap:6px;align-items:center}.rolling-due-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.rolling-due-actions .recordbtn{padding:7px 10px}@media(max-width:380px){.rolling-item{align-items:flex-start}.rolling-actions{flex-direction:column}}\n"
          p.write_text(s)

          p=Path('xizong-study/sw.js')
          s=p.read_text().replace('xizong-study-v15-20260830','xizong-study-v16-20260830').replace('?v=15','?v=16')
          p.write_text(s)
          PY
          node --check xizong-study/app.js
          grep -q 'data-view="rolling"' xizong-study/index.html
          grep -q 'function renderRolling' xizong-study/app.js
          grep -q 'rollingReviews' xizong-study/app.js
          grep -q '1 / 3 / 7 / 15 / 30' xizong-study/index.html
      - name: Commit rolling review upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/app.js xizong-study/index.html xizong-study/styles.css xizong-study/sw.js
          git commit -m "Add rolling review navigation and schedule"
          git push origin main
