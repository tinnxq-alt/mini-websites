name: Build Xizong Signed Release APK

on:
  push:
    branches: [main]
    paths:
      - xizong-study/**
      - .github/workflows/build-xizong-release-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.XIZONG_ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.XIZONG_ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.XIZONG_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.XIZONG_ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: 8F:51:61:90:42:95:D7:9B:B4:A3:A2:8E:24:57:87:1F:58:0C:0D:6B:5D:6E:2A:4E:24:AB:9B:B1:D2:C5:68:0A

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check signing secrets
        id: signing
        shell: bash
        run: |
          if [[ -n "${KEYSTORE_B64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fixed-signature release is ready. Add the four XIZONG_ANDROID_* repository secrets to enable signed release builds."
          fi

      - name: Setup Node
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Capacitor Android release wrapper
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apk-build
          mkdir -p apk-build/www
          cp -R xizong-study/. apk-build/www/
          cd apk-build
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tinnxq.xizongstudy",
            "appName": "西综作战室",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android
          cd android
          printf '%s' "$KEYSTORE_B64" | base64 --decode > xizong-release.jks
          chmod 600 xizong-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('app/build.gradle')
          s=p.read_text()
          version=int(os.environ['GITHUB_RUN_NUMBER'])
          s=re.sub(r'versionCode\s+\d+', f'versionCode {version}', s, count=1)
          s=re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{version}"', s, count=1)
          s += r'''

          android {
              signingConfigs {
                  xizongRelease {
                      storeFile file(System.getenv("XIZONG_KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.xizongRelease
                  }
              }
          }
          '''
          p.write_text(s)
          PY

      - name: Verify fixed signing key
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          INFO=$(keytool -list -v -keystore apk-build/android/xizong-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS")
          printf '%s\n' "$INFO" | grep -F "SHA256: $EXPECTED_CERT_SHA256"

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd apk-build/android
          export XIZONG_KEYSTORE_PATH="$PWD/xizong-release.jks"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="apk-build/android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Package signed APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp apk-build/android/app/build/outputs/apk/release/app-release.apk 西综作战室-正式个人版.apk
          cat > release-info.txt <<EOF
          appId=com.tinnxq.xizongstudy
          versionCode=${GITHUB_RUN_NUMBER}
          versionName=1.0.${GITHUB_RUN_NUMBER}
          certificateSHA256=${EXPECTED_CERT_SHA256}
          EOF
          ls -lh 西综作战室-正式个人版.apk release-info.txt

      - name: Upload signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xizong-study-signed-release-apk
          path: |
            西综作战室-正式个人版.apk
            release-info.txt
          if-no-files-found: error
          retention-days: 30
