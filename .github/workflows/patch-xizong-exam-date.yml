name: Patch Xizong exam date

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-xizong-exam-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update exam date and PWA cache
        shell: python
        run: |
          from pathlib import Path

          p = Path('xizong-study/app.js')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("const V=9,SUB=", "const V=10,SUB="),
            ("examDate:'2026-12-20'", "examDate:'2026-12-19'"),
            ("s.settings.examDate=st.examDate||s.settings.examDate;", "s.settings.examDate=(st.examDate==='2026-12-20'?'2026-12-19':st.examDate)||s.settings.examDate;"),
            ("for(const k of ['xizong-study-v9','xizong-study-v8','xizong-study-os-v1','xizong-study-v7'])", "for(const k of ['xizong-study-v10','xizong-study-v9','xizong-study-v8','xizong-study-os-v1','xizong-study-v7'])"),
            ("localStorage.setItem('xizong-study-v9'", "localStorage.setItem('xizong-study-v10'"),
            ("indexedDB.open('xizong-study-v9-db',1)", "indexedDB.open('xizong-study-v10-db',1)"),
            ("<span class=\"badge\">PWA v9</span>", "<span class=\"badge\">PWA v10</span>")
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing expected app.js fragment: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          idx = Path('xizong-study/index.html')
          h = idx.read_text(encoding='utf-8')
          h = h.replace('./styles.css?v=8', './styles.css?v=10').replace('./app.js?v=8', './app.js?v=10')
          idx.write_text(h, encoding='utf-8')

          sw = Path('xizong-study/sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace("xizong-study-v9-20260829", "xizong-study-v10-20260829")
          w = w.replace('./styles.css?v=8', './styles.css?v=10').replace('./app.js?v=8', './app.js?v=10')
          sw.write_text(w, encoding='utf-8')
      - name: Verify
        run: |
          node --check xizong-study/app.js
          grep -q "examDate:'2026-12-19'" xizong-study/app.js
          grep -q "PWA v10" xizong-study/app.js
          grep -q "app.js?v=10" xizong-study/index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/app.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Set Xizong exam date to December 19"
          git push
