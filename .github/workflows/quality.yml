name: Mini websites quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: JavaScript syntax
        run: |
          node --check xizong-study/app.js
          node --check xizong-study/integrated-runtime.js

      - name: Core files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html styles.css app.js integrated-runtime.js sw.js manifest.webmanifest icon.svg; do
            test -f "xizong-study/$f"
          done

      - name: Core feature guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-view="rolling"' xizong-study/index.html
          grep -Fq 'data-a="edit-record"' xizong-study/app.js
          grep -Fq 'data-a="del-record"' xizong-study/app.js
          grep -Fq 'recordEditId' xizong-study/index.html
          grep -Fq 'record-swipe.open' xizong-study/styles.css
          grep -Fq "label:'病理 + 生理 + 内科'" xizong-study/integrated-runtime.js
          grep -Fq "label:'外科'" xizong-study/integrated-runtime.js
          grep -Fq "label:'生化'" xizong-study/integrated-runtime.js
          grep -Fq '明日滚动' xizong-study/integrated-runtime.js
          grep -Fq '今日顺延' xizong-study/integrated-runtime.js
          grep -Fq 'early-complete-one' xizong-study/integrated-runtime.js
          grep -Fq 'early-complete-initial' xizong-study/integrated-runtime.js
          grep -Fq 'uxEarlyCompletedFrom' xizong-study/integrated-runtime.js
          grep -Fq 'pause-timer' xizong-study/integrated-runtime.js
          grep -Fq 'timer.paused&&timer.pausedAt' xizong-study/app.js
          grep -Fq '滚动项目已删除' xizong-study/integrated-runtime.js
          grep -Fq '导出学习记录 CSV' xizong-study/integrated-runtime.js

      - name: Performance and bug guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'window.__xizongRollingCatalog=CATALOG' xizong-study/integrated-runtime.js
          grep -Fq 'const ROLLING_CATALOG=window.__xizongRollingCatalog||[]' xizong-study/app.js
          grep -Fq 'window.__xizongRender' xizong-study/app.js
          grep -Fq 'function commitState' xizong-study/integrated-runtime.js
          grep -Fq "correctRaw===''" xizong-study/app.js
          grep -Fq '...n,index:' xizong-study/app.js
          ! grep -Fq 'location.reload()' xizong-study/integrated-runtime.js
          ! grep -Fq 'const ROLLING_CATALOG=[' xizong-study/app.js
          ! grep -Fq 'MutationObserver' xizong-study/integrated-runtime.js
          ! grep -Fq '已暂停滚动' xizong-study/integrated-runtime.js
          ! grep -Fq 'data-ux="batch-pause"' xizong-study/integrated-runtime.js
          ! grep -Fq '<input id="importFile" class="hidden" type="file" accept="application/json">' xizong-study/app.js
          test "$(grep -o 'id="importFile"' xizong-study/index.html | wc -l)" -eq 1

      - name: Version and cleanup guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'integrated-runtime.js?v=45' xizong-study/index.html
          grep -Fq 'app.js?v=45' xizong-study/index.html
          grep -Fq 'xizong-study-v45-20260830' xizong-study/sw.js
          test ! -e xizong-study/timer.css
          test ! -e xizong-study/powerups.css
          test ! -e xizong-study/perf-guard.js
          test ! -e xizong-study/rolling-tasks.js
          test ! -e xizong-study/rolling-picker.js
          test ! -e xizong-study/rolling-custom.js
          test ! -e xizong-study/powerups.js
          test ! -e xizong-study/rolling-today-sync.js
