name: Mini websites quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Xizong Study JavaScript
        run: |
          node --check xizong-study/app.js
          node --check xizong-study/rolling-picker.js
          node --check xizong-study/rolling-tasks.js
      - name: Verify required features
        shell: bash
        run: |
          set -euo pipefail
          grep -q "西综复习（非刷题）" xizong-study/index.html
          grep -q "prog-range" xizong-study/app.js
          grep -q "subject-check" xizong-study/app.js
          grep -q "add-mock" xizong-study/app.js
          grep -q "save-schedule" xizong-study/app.js
          grep -q "data-view=\"rolling\"" xizong-study/index.html
          grep -q "rollCatalogCategory" xizong-study/index.html
          grep -q "value=\"rolling\"" xizong-study/index.html
          grep -q "tRollingItem" xizong-study/index.html
          grep -q "病理 + 生理 + 内科" xizong-study/rolling-picker.js
          grep -q "2. 外科" xizong-study/rolling-picker.js
          grep -q "3. 生化" xizong-study/rolling-picker.js
          grep -q "syncDueTasks" xizong-study/rolling-tasks.js
          grep -q "syncLinkedTasks" xizong-study/rolling-tasks.js
          grep -q "xizong-study-v19-20260830" xizong-study/sw.js
          ! grep -q "rollGroup" xizong-study/index.html
          ! grep -q "data-roll-mode" xizong-study/index.html
          ! grep -q "默认循环" xizong-study/index.html
          ! grep -q "默认循环" xizong-study/app.js
