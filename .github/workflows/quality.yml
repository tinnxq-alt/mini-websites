name: Mini websites quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Xizong Study JavaScript
        run: |
          node --check xizong-study/app.js
          node --check xizong-study/integrated-runtime.js
      - name: Verify required features
        shell: bash
        run: |
          set -euo pipefail
          grep -q "prog-range" xizong-study/app.js
          grep -q "subject-check" xizong-study/app.js
          grep -q "add-mock" xizong-study/app.js
          grep -q "save-schedule" xizong-study/app.js
          grep -q 'data-a="edit-record"' xizong-study/app.js
          grep -q 'data-a="del-record"' xizong-study/app.js
          grep -q "recordEditId" xizong-study/index.html
          grep -q "record-swipe.open" xizong-study/styles.css
          grep -q "data-view=\"rolling\"" xizong-study/index.html
          grep -q "rollCatalogCategory" xizong-study/index.html
          grep -q "立即同步到“今日到期”" xizong-study/index.html
          grep -q "病理 + 生理 + 内科" xizong-study/integrated-runtime.js
          grep -q "2. 外科" xizong-study/integrated-runtime.js
          grep -q "3. 生化" xizong-study/integrated-runtime.js
          grep -q "自己添加" xizong-study/integrated-runtime.js
          grep -q "rollCustomVisible" xizong-study/integrated-runtime.js
          grep -q "ensureInitialTasks" xizong-study/integrated-runtime.js
          grep -q "ensureDueTasks" xizong-study/integrated-runtime.js
          grep -q "if(item.paused)continue" xizong-study/integrated-runtime.js
          grep -q "renderRollingEnhanced" xizong-study/integrated-runtime.js
          grep -q "batch-complete" xizong-study/integrated-runtime.js
          grep -q "pause-timer" xizong-study/integrated-runtime.js
          grep -q "uxTimerBar" xizong-study/integrated-runtime.js
          grep -q "timer.paused&&timer.pausedAt" xizong-study/app.js
          grep -q "timer-mode-grid" xizong-study/styles.css
          grep -q "ux-timer-bar" xizong-study/styles.css
          grep -q "套卷正确率趋势" xizong-study/integrated-runtime.js
          grep -q "导出学习记录 CSV" xizong-study/integrated-runtime.js
          grep -q "当天学习 · 加入滚动" xizong-study/integrated-runtime.js
          grep -q " const rollingId=uid()\|const rollingId=uid()" xizong-study/app.js
          grep -q "rollingInitial:true" xizong-study/app.js
          grep -q "p.label==='滚动项目已删除'" xizong-study/integrated-runtime.js
          grep -q "p.label==='已暂停滚动'" xizong-study/integrated-runtime.js
          grep -q "if(!wasPaused)stashUndo('已暂停滚动')" xizong-study/integrated-runtime.js
          grep -q "else sessionStorage.removeItem(UNDO_KEY)" xizong-study/integrated-runtime.js
          grep -q "ux-restore-view" xizong-study/integrated-runtime.js
          grep -q "view=sessionStorage.getItem('ux-restore-view')||'today'" xizong-study/app.js
          grep -Fq "window.__xizongSyncState" xizong-study/app.js
          grep -Fq "window.__xizongRefreshTimer" xizong-study/app.js
          grep -Fq "已暂停；时间已冻结" xizong-study/app.js
          grep -Fq "window.__xizongSyncState?.(state);refresh(0)" xizong-study/integrated-runtime.js
          grep -Fq "window.__xizongRefreshTimer?.()" xizong-study/integrated-runtime.js
          grep -Fq "if(a==='toggle-rolling-pause')" xizong-study/integrated-runtime.js
          grep -q "明日滚动" xizong-study/integrated-runtime.js
          grep -q "明日计划" xizong-study/integrated-runtime.js
          grep -q "今日顺延" xizong-study/integrated-runtime.js
          grep -q "early-complete-one" xizong-study/integrated-runtime.js
          grep -q "early-complete-initial" xizong-study/integrated-runtime.js
          grep -q "uxDelayedFrom=today()" xizong-study/integrated-runtime.js
          grep -q "styles.css?v=39" xizong-study/index.html
          grep -q "integrated-runtime.js?v=41" xizong-study/index.html
          grep -q "app.js?v=40" xizong-study/index.html
          grep -q "xizong-study-v41-20260830" xizong-study/sw.js
          ! grep -q "timer.css" xizong-study/index.html
          ! grep -q "powerups.css" xizong-study/index.html
          ! grep -q 'data-ux="batch-pause"' xizong-study/integrated-runtime.js
          ! grep -q "ux==='batch-pause'" xizong-study/integrated-runtime.js
          ! grep -q "stashUndo(item.paused?'已恢复滚动':'已暂停滚动')" xizong-study/integrated-runtime.js
          ! grep -q "if(syncPersistentState())location.reload()" xizong-study/integrated-runtime.js
          ! grep -q "MutationObserver" xizong-study/integrated-runtime.js
          ! grep -q "任务状态已更新" xizong-study/integrated-runtime.js
          ! grep -q "学习记录已更新" xizong-study/integrated-runtime.js
          ! grep -q "toast('已完成')" xizong-study/app.js
          ! grep -q "toast('滚动复习已完成')" xizong-study/app.js
          ! grep -q "toast('已顺延 1 天')" xizong-study/app.js
          ! grep -q "toast('已跳过本轮')" xizong-study/app.js
          ! grep -q "toast('已加入滚动复习')" xizong-study/app.js
          ! grep -q "stashUndo('当天滚动学习已完成')" xizong-study/integrated-runtime.js
          ! grep -q "stashUndo(kind==='complete'" xizong-study/integrated-runtime.js
          ! grep -q "西综复习（非刷题）" xizong-study/index.html
          ! grep -q "tRollingItem" xizong-study/index.html
          ! grep -q "rollingTaskFields" xizong-study/index.html
          ! grep -q "value=\"rolling\"" xizong-study/index.html
          ! grep -q "默认循环" xizong-study/index.html
          ! grep -q "默认循环" xizong-study/app.js
          test ! -e xizong-study/timer.css
          test ! -e xizong-study/powerups.css
          test ! -e xizong-study/perf-guard.js
          test ! -e xizong-study/rolling-tasks.js
          test ! -e xizong-study/rolling-picker.js
          test ! -e xizong-study/rolling-custom.js
          test ! -e xizong-study/powerups.js
          test ! -e xizong-study/rolling-today-sync.js
