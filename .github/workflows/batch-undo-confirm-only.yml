name: Limit confirm button to batch undo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/batch-undo-confirm-only.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Limit confirm button to batch undo
        shell: python
        run: |
          from pathlib import Path
          runtime=Path('xizong-study/integrated-runtime.js')
          text=runtime.read_text(encoding='utf-8')
          old='el.innerHTML=`<span>${esc(p.label||\'已更新\')}</span><button data-ux="undo">撤销</button><button data-ux="confirm-undo">确定</button>`;'
          new='const batch=String(p.label||\'\').startsWith(\'已批量\');el.innerHTML=`<span>${esc(p.label||\'已更新\')}</span><button data-ux="undo">撤销</button>${batch?\'<button data-ux="confirm-undo">确定</button>\':\'\'}`;'
          assert old in text, 'current undo markup not found'
          runtime.write_text(text.replace(old,new,1),encoding='utf-8')

          index=Path('xizong-study/index.html')
          text=index.read_text(encoding='utf-8').replace('integrated-runtime.js?v=29','integrated-runtime.js?v=30').replace('app.js?v=29','app.js?v=30')
          index.write_text(text,encoding='utf-8')

          sw=Path('xizong-study/sw.js')
          text=sw.read_text(encoding='utf-8').replace('xizong-study-v29-20260830','xizong-study-v30-20260830').replace('integrated-runtime.js?v=29','integrated-runtime.js?v=30').replace('app.js?v=29','app.js?v=30')
          sw.write_text(text,encoding='utf-8')
      - name: Validate JavaScript
        run: node --check xizong-study/integrated-runtime.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/integrated-runtime.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Show confirm only for batch undo prompts"
          git push
