name: Remove batch pause and freeze timer v38

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-batch-pause-freeze-timer-v38.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove batch pause and make timer pause authoritative
        shell: python
        run: |
          from pathlib import Path

          rt=Path('xizong-study/integrated-runtime.js')
          s=rt.read_text(encoding='utf-8')
          old='<button data-ux="batch-complete">批量完成</button><button data-ux="batch-delay">顺延1天</button><button data-ux="batch-pause">批量暂停</button>'
          new='<button data-ux="batch-complete">批量完成</button><button data-ux="batch-delay">顺延1天</button>'
          assert old in s, 'batch pause button not found'
          s=s.replace(old,new,1)
          old="if(ux==='batch-complete')return mutateSelected('complete');if(ux==='batch-delay')return mutateSelected('delay');if(ux==='batch-pause')return mutateSelected('pause');"
          new="if(ux==='batch-complete')return mutateSelected('complete');if(ux==='batch-delay')return mutateSelected('delay');"
          assert old in s, 'batch pause handler not found'
          s=s.replace(old,new,1)
          rt.write_text(s,encoding='utf-8')

          app=Path('xizong-study/app.js')
          s=app.read_text(encoding='utf-8')
          old="function timerElapsedSeconds(timer=state.activeTimer){if(!timer)return 0;return Math.max(0,Math.floor((Date.now()-Number(timer.startedAt))/1000))}"
          new="function timerElapsedSeconds(timer=state.activeTimer){if(!timer)return 0;const now=timer.paused&&timer.pausedAt?Number(timer.pausedAt):Date.now();return Math.max(0,Math.floor((now-Number(timer.startedAt))/1000))}"
          assert old in s, 'base timer elapsed function not found'
          s=s.replace(old,new,1)
          app.write_text(s,encoding='utf-8')

          idx=Path('xizong-study/index.html')
          s=idx.read_text(encoding='utf-8').replace('integrated-runtime.js?v=37','integrated-runtime.js?v=38').replace('app.js?v=36','app.js?v=38')
          idx.write_text(s,encoding='utf-8')

          sw=Path('xizong-study/sw.js')
          s=sw.read_text(encoding='utf-8').replace('xizong-study-v37-20260830','xizong-study-v38-20260830').replace('integrated-runtime.js?v=37','integrated-runtime.js?v=38').replace('app.js?v=36','app.js?v=38')
          sw.write_text(s,encoding='utf-8')

      - name: Validate
        run: |
          node --check xizong-study/app.js
          node --check xizong-study/integrated-runtime.js
          ! grep -q 'data-ux="batch-pause"' xizong-study/integrated-runtime.js
          ! grep -q "ux==='batch-pause'" xizong-study/integrated-runtime.js
          grep -q "timer.paused&&timer.pausedAt" xizong-study/app.js
          grep -q "integrated-runtime.js?v=38" xizong-study/index.html
          grep -q "app.js?v=38" xizong-study/index.html
          grep -q "xizong-study-v38-20260830" xizong-study/sw.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/integrated-runtime.js xizong-study/app.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Remove batch pause and freeze paused timer"
          git push
