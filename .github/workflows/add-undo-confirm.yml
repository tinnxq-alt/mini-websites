name: Apply undo confirm action

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-undo-confirm.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add confirm button to undo prompt
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('xizong-study/integrated-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          old = "el.innerHTML=`<span>${esc(p.label||'已更新')}</span><button data-ux=\"undo\">撤销</button>`;"
          new = "el.innerHTML=`<span>${esc(p.label||'已更新')}</span><button data-ux=\"undo\">撤销</button><button data-ux=\"confirm-undo\">确定</button>`;"
          assert old in text, 'undo prompt markup not found'
          text = text.replace(old, new, 1)

          marker = "    if(ux==='undo')return undo();\n"
          insert = "    if(ux==='confirm-undo'){sessionStorage.removeItem(UNDO_KEY);const el=$('#uxUndo');el?.classList.remove('show');return}\n"
          assert marker in text, 'undo click handler not found'
          text = text.replace(marker, marker + insert, 1)
          runtime.write_text(text, encoding='utf-8')

          index = Path('xizong-study/index.html')
          text = index.read_text(encoding='utf-8').replace('integrated-runtime.js?v=28','integrated-runtime.js?v=29').replace('app.js?v=28','app.js?v=29')
          index.write_text(text, encoding='utf-8')

          sw = Path('xizong-study/sw.js')
          text = sw.read_text(encoding='utf-8').replace('xizong-study-v28-20260830','xizong-study-v29-20260830').replace('integrated-runtime.js?v=28','integrated-runtime.js?v=29').replace('app.js?v=28','app.js?v=29')
          sw.write_text(text, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check xizong-study/integrated-runtime.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/integrated-runtime.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Add confirm action to undo prompt"
          git push
