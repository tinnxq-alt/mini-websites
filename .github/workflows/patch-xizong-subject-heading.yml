name: Patch Xizong subject heading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-xizong-subject-heading.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove year range from subject progress heading
        shell: python
        run: |
          from pathlib import Path
          p = Path('xizong-study/app.js')
          s = p.read_text(encoding='utf-8')
          old = '<h2>学科真题 · 2000–2016</h2>'
          new = '<h2>学科进度</h2>'
          if old not in s:
            raise SystemExit('expected heading not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Verify
        run: |
          node --check xizong-study/app.js
          grep -q '<h2>学科进度</h2>' xizong-study/app.js
          ! grep -q '学科真题 · 2000–2016' xizong-study/app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/app.js
          git commit -m "Simplify Xizong subject progress heading"
          git push
