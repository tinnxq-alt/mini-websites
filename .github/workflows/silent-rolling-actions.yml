name: Silent rolling review actions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/silent-rolling-actions.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove rolling review success prompts and undo notices
        shell: python
        run: |
          from pathlib import Path
          p=Path('xizong-study/integrated-runtime.js')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ("if(['rolling-complete','rolling-delay','rolling-skip'].includes(a))stashUndo('滚动复习已更新');", ""),
            ("stashUndo('当天滚动学习已完成');", ""),
            ("stashUndo(action==='complete'?'滚动复习已完成':action==='delay'?'滚动复习已顺延':'本轮已跳过');", ""),
            ("stashUndo(kind==='complete'?'已批量完成':kind==='delay'?'已批量顺延':'已批量暂停');", ""),
          ]
          for old,new in replacements:
            if old in s:
              s=s.replace(old,new)
          # success toasts for rolling-only actions; keep validation/input/delete confirmations
          for old in [
            "toast(r.paused?'已暂停':'已继续')",
            "toast('已加入滚动复习')",
          ]:
            s=s.replace(old,"void 0")
          p.write_text(s,encoding='utf-8')

          p=Path('xizong-study/app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("toast(r.paused?'已暂停':'已继续')","void 0")
          s=s.replace("toast('已加入滚动复习')","void 0")
          p.write_text(s,encoding='utf-8')

          p=Path('xizong-study/index.html')
          s=p.read_text(encoding='utf-8').replace('integrated-runtime.js?v=30','integrated-runtime.js?v=31').replace('app.js?v=30','app.js?v=31')
          p.write_text(s,encoding='utf-8')

          p=Path('xizong-study/sw.js')
          s=p.read_text(encoding='utf-8').replace('xizong-study-v30-20260830','xizong-study-v31-20260830').replace('integrated-runtime.js?v=30','integrated-runtime.js?v=31').replace('app.js?v=30','app.js?v=31')
          p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: |
          node --check xizong-study/integrated-runtime.js
          node --check xizong-study/app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/integrated-runtime.js xizong-study/app.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Make rolling review actions silent"
          git push
