name: Build Rewardly APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'rewardly-android/**'
      - '.github/workflows/build-rewardly-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rewardly-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p rewardly-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rewardly-APK
          path: rewardly-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
