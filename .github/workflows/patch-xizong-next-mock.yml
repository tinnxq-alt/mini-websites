name: Patch Xizong custom next mock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-xizong-next-mock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add custom next mock selection
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('xizong-study/app.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ("const V=10,SUB=", "const V=11,SUB="),
            ("mockPapers:defaultPapers(),tasks:", "mockPapers:defaultPapers(),nextMockId:null,tasks:"),
            ("else s.mockPapers=defaultPapers().map(p=>({...p,done:doneYears.has(p.year)}));return s}", "else s.mockPapers=defaultPapers().map(p=>({...p,done:doneYears.has(p.year)}));s.nextMockId=src.nextMockId&&s.mockPapers.some(p=>p.id===src.nextMockId&&!p.done)?src.nextMockId:null;return s}"),
            ("for(const k of ['xizong-study-v10','xizong-study-v9','xizong-study-v8','xizong-study-os-v1','xizong-study-v7'])", "for(const k of ['xizong-study-v11','xizong-study-v10','xizong-study-v9','xizong-study-v8','xizong-study-os-v1','xizong-study-v7'])"),
            ("localStorage.setItem('xizong-study-v10'", "localStorage.setItem('xizong-study-v11'"),
            ("indexedDB.open('xizong-study-v10-db',1)", "indexedDB.open('xizong-study-v11-db',1)"),
            ("function nextPaper(){return state.mockPapers.find(p=>!p.done)||null}", "function nextPaper(){const chosen=state.nextMockId?state.mockPapers.find(p=>p.id===state.nextMockId&&!p.done):null;return chosen||state.mockPapers.find(p=>!p.done)||null}"),
            ("${p.done?'已完成':'等待安排'} · ${p.questions} 题", "${p.done?'已完成':(n?.id===p.id?'下一套':'待安排')} · ${p.questions} 题"),
            ("<span class=\"badge\">PWA v10</span>", "<span class=\"badge\">PWA v11</span>")
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing expected fragment: {old[:100]}')
            s = s.replace(old, new, 1)

          old_buttons = '''<div class="mock-actions"><button class="mockbtn ${p.done?'done':''}" data-a="toggle-mock" data-id="${p.id}">${p.done?'✓ 已完成':(n?.id===p.id?'下一套':'待做')}</button><button class="xbtn" data-a="del-mock" data-id="${p.id}">×</button></div>'''
          new_buttons = '''<div class="mock-actions"><button class="mockbtn ${n?.id===p.id&&!p.done?'done':''}" data-a="set-next-mock" data-id="${p.id}" ${p.done?'disabled':''}>${n?.id===p.id&&!p.done?'✓ 下一套':'设为下一套'}</button><button class="mockbtn ${p.done?'done':''}" data-a="toggle-mock" data-id="${p.id}">${p.done?'✓ 已完成':'标记完成'}</button><button class="xbtn" data-a="del-mock" data-id="${p.id}">×</button></div>'''
          if old_buttons not in s:
            raise SystemExit('mock action buttons fragment not found')
          s = s.replace(old_buttons, new_buttons, 1)

          old_mark = "function markMock(task,done){if(task?.type!=='mock')return;const p=state.mockPapers.find(x=>x.id===task.mockId)||state.mockPapers.find(x=>x.year&&x.year===task.year);if(p)p.done=done}"
          new_mark = "function markMock(task,done){if(task?.type!=='mock')return;const p=state.mockPapers.find(x=>x.id===task.mockId)||state.mockPapers.find(x=>x.year&&x.year===task.year);if(p){p.done=done;if(done&&state.nextMockId===p.id)state.nextMockId=null}}"
          if old_mark not in s:
            raise SystemExit('markMock fragment not found')
          s = s.replace(old_mark, new_mark, 1)

          old_toggle = "if(a==='toggle-mock'){const p=state.mockPapers.find(x=>x.id===id);if(p){p.done=!p.done;state.tasks=state.tasks.filter(t=>!(t.auto&&t.date===today()&&!t.done));save();render()}}"
          new_toggle = "if(a==='set-next-mock'){const p=state.mockPapers.find(x=>x.id===id);if(p&&!p.done){state.nextMockId=p.id;state.tasks=state.tasks.filter(t=>!(t.auto&&t.date===today()&&!t.done));save();render();toast('已设为下一套')}}if(a==='toggle-mock'){const p=state.mockPapers.find(x=>x.id===id);if(p){p.done=!p.done;if(p.done&&state.nextMockId===p.id)state.nextMockId=null;state.tasks=state.tasks.filter(t=>!(t.auto&&t.date===today()&&!t.done));save();render()}}"
          if old_toggle not in s:
            raise SystemExit('toggle-mock handler not found')
          s = s.replace(old_toggle, new_toggle, 1)

          old_delete = "if(a==='del-mock'){const p=state.mockPapers.find(x=>x.id===id);if(p&&confirm(`删除“${p.name}”吗？`)){state.mockPapers=state.mockPapers.filter(x=>x.id!==id);state.tasks=state.tasks.filter(t=>t.mockId!==id||t.done);save();render()}}"
          new_delete = "if(a==='del-mock'){const p=state.mockPapers.find(x=>x.id===id);if(p&&confirm(`删除“${p.name}”吗？`)){if(state.nextMockId===id)state.nextMockId=null;state.mockPapers=state.mockPapers.filter(x=>x.id!==id);state.tasks=state.tasks.filter(t=>t.mockId!==id||t.done);save();render()}}"
          if old_delete not in s:
            raise SystemExit('del-mock handler not found')
          s = s.replace(old_delete, new_delete, 1)

          p.write_text(s, encoding='utf-8')

          idx = Path('xizong-study/index.html')
          h = idx.read_text(encoding='utf-8').replace('./styles.css?v=10','./styles.css?v=11').replace('./app.js?v=10','./app.js?v=11')
          idx.write_text(h, encoding='utf-8')

          sw = Path('xizong-study/sw.js')
          w = sw.read_text(encoding='utf-8').replace('xizong-study-v10-20260829','xizong-study-v11-20260829').replace('./styles.css?v=10','./styles.css?v=11').replace('./app.js?v=10','./app.js?v=11')
          sw.write_text(w, encoding='utf-8')
      - name: Verify
        run: |
          node --check xizong-study/app.js
          grep -q "function nextPaper(){const chosen=state.nextMockId" xizong-study/app.js
          grep -q "data-a=\"set-next-mock\"" xizong-study/app.js
          grep -q "PWA v11" xizong-study/app.js
          grep -q "app.js?v=11" xizong-study/index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/app.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Allow custom selection of next Xizong mock"
          git push
