name: Patch Xizong Study v9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-xizong-v9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch mock question count and single slider
        shell: python
        run: |
          from pathlib import Path

          p = Path('xizong-study/app.js')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("const V=8,SUB=", "const V=9,SUB="),
            ("questions:180,minutes:180,done:false", "questions:165,minutes:180,done:false"),
            ("s.tasks=Array.isArray(src.tasks)?src.tasks:[];", "s.tasks=Array.isArray(src.tasks)?src.tasks.map(t=>t?.type==='mock'&&Number(t.questions)===180?{...t,questions:165}:t):[];"),
            ("questions:Number(p.questions)||180,minutes:Number(p.minutes)||180", "questions:Number(p.questions)===180?165:(Number(p.questions)||165),minutes:Number(p.minutes)||180"),
            ("for(const k of ['xizong-study-v8','xizong-study-os-v1','xizong-study-v7'])", "for(const k of ['xizong-study-v9','xizong-study-v8','xizong-study-os-v1','xizong-study-v7'])"),
            ("localStorage.setItem('xizong-study-v8'", "localStorage.setItem('xizong-study-v9'"),
            ("indexedDB.open('xizong-study-v8-db',1)", "indexedDB.open('xizong-study-v9-db',1)"),
            ("`${t.questions||180} 题 · ${t.minutes||180} 分钟`", "`${t.questions||165} 题 · ${t.minutes||180} 分钟`"),
            ("<b>${s}</b><div class=\"progress\" style=\"margin-top:8px\"><i style=\"width:${state.subjectProgress[s]||0}%\"></i></div><div class=\"range-wrap\">", "<b>${s}</b><div class=\"range-wrap\">"),
            ("新增套卷默认 180 题、180 分钟。", "新增套卷默认 165 题、180 分钟。"),
            ("<span class=\"badge\">PWA v8</span>", "<span class=\"badge\">PWA v9</span>"),
            ("row.querySelector('.progress i').style.width=v+'%'", "void 0")
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing expected app.js fragment: {old[:90]}')
            s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          sw = Path('xizong-study/sw.js')
          w = sw.read_text(encoding='utf-8')
          if "xizong-study-v8-20260829" not in w:
            raise SystemExit('missing expected v8 cache key')
          w = w.replace('xizong-study-v8-20260829', 'xizong-study-v9-20260829')
          sw.write_text(w, encoding='utf-8')
      - name: Verify JavaScript
        run: node --check xizong-study/app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/app.js xizong-study/sw.js
          git commit -m "Fix Xizong mock count and simplify progress slider"
          git push
