name: Fix refresh loop v35

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-refresh-loop-v35.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix rolling refresh loop
        shell: python
        run: |
          from pathlib import Path

          rt=Path('xizong-study/integrated-runtime.js')
          s=rt.read_text(encoding='utf-8')

          old="  for(const item of state.rollingReviews){\n    if(state.tasks.some(t=>t.type==='rolling'&&t.rollingId===item.id&&t.rollingInitial))continue;"
          new="  for(const item of state.rollingReviews){\n    if(item.paused)continue;\n    if(state.tasks.some(t=>t.type==='rolling'&&t.rollingId===item.id&&t.rollingInitial))continue;"
          assert old in s, 'ensureInitialTasks loop not found'
          s=s.replace(old,new,1)

          old="setTimeout(()=>{if(syncPersistentState())location.reload();else{restoreView();refresh(0)}},30);"
          new="setTimeout(()=>{restoreView();refresh(0)},30);"
          assert old in s, 'startup reload block not found'
          s=s.replace(old,new,1)

          rt.write_text(s,encoding='utf-8')

          p=Path('xizong-study/index.html')
          s=p.read_text(encoding='utf-8').replace('integrated-runtime.js?v=34','integrated-runtime.js?v=35').replace('app.js?v=34','app.js?v=35')
          p.write_text(s,encoding='utf-8')

          p=Path('xizong-study/sw.js')
          s=p.read_text(encoding='utf-8').replace('xizong-study-v34-20260830','xizong-study-v35-20260830').replace('integrated-runtime.js?v=34','integrated-runtime.js?v=35').replace('app.js?v=34','app.js?v=35')
          p.write_text(s,encoding='utf-8')

      - name: Validate JavaScript
        run: |
          node --check xizong-study/integrated-runtime.js
          node --check xizong-study/app.js
          grep -q "if(item.paused)continue" xizong-study/integrated-runtime.js
          ! grep -q "if(syncPersistentState())location.reload()" xizong-study/integrated-runtime.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/integrated-runtime.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Fix rolling refresh loop"
          git push
