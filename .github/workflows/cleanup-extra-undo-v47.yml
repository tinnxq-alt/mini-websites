name: Cleanup extra review and undo prompts v47

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-extra-undo-v47.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v47 cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('xizong-study/integrated-runtime.js')
          s = runtime.read_text()
          s = s.replace("const STORE_KEY='xizong-study-v11',DB_NAME='xizong-study-v11-db',UNDO_KEY='xizong-study-undo-v1',CUSTOM='__custom__';", "const STORE_KEY='xizong-study-v11',DB_NAME='xizong-study-v11-db',CUSTOM='__custom__';")
          s = s.replace("const note=node?`${item.name} · 第${node.index}轮`:task.rollingInitial?`${item.name} · 加入滚动`:`${item.name} · 额外复习`;", "const note=node?`${item.name} · 第${node.index}轮`:task.rollingInitial?`${item.name} · 加入滚动`:`${item.name} · 滚动复习`;")
          s = s.replace("function syncPersistentState(){const state=read();if(!state)return false;const changed=syncLinkedTasks(state)|ensureInitialTasks(state)|ensureDueTasks(state);if(changed)write(state);return !!changed}", "function cleanupLegacyLabels(state){let changed=false;for(const r of (state.records||[])){if(r.type==='rolling'&&String(r.note||'').includes('额外复习')){r.note=String(r.note).replace(/额外复习/g,'滚动复习');changed=true}}return changed}\nfunction syncPersistentState(){const state=read();if(!state)return false;const changed=cleanupLegacyLabels(state)|syncLinkedTasks(state)|ensureInitialTasks(state)|ensureDueTasks(state);if(changed)write(state);return !!changed}")
          s = re.sub(r",extra=\(state\.records\|\|\[\]\)\.filter\(r=>r\.type==='rolling'&&!r\.rollingIndex&&String\(r\.note\|\|''\)\.includes\('额外复习'\)\),extraMin=extra\.reduce\(\(a,r\)=>a\+\(Number\(r\.minutes\)\|\|0\),0\);", ";", s)
          s = s.replace('<div class="stats ux-stats4">', '<div class="stats ux-stats3">')
          s = re.sub(r'<div class=\\"stat\\"><span class=\\"small muted\\">额外复习</span><b>\$\{extra\.length\}<small> 次</small></b><div class=\\"daily-note\\">\$\{extraMin\} min</div></div>', '', s)
          s = s.replace("const phase=node?`第${node.index}轮`:task.rollingInitial?'加入滚动':'额外复习';", "const phase=node?`第${node.index}轮`:task.rollingInitial?'加入滚动':'滚动复习';")
          s = re.sub(r"/\* ---------- operations / undo ---------- \*/\nfunction stashUndo\(label\).*?function completeInitial", "/* ---------- operations ---------- */\nfunction completeInitial", s, flags=re.S)
          s = s.replace("function deleteRollingProject(id){const state=read(),item=findItem(state,id);if(!item)return;stashUndo('滚动项目已删除');", "function deleteRollingProject(id){const state=read(),item=findItem(state,id);if(!item)return;")
          s = s.replace("stashUndo('任务已删除');", "")
          s = s.replace("if(raw===null){sessionStorage.removeItem(UNDO_KEY);return}", "if(raw===null)return")
          s = s.replace(";showUndo()}),delay)", ";}),delay)")
          s = s.replace("    if(ux==='undo')return undo();\n    if(ux==='confirm-undo'){sessionStorage.removeItem(UNDO_KEY);const el=$('#uxUndo');el?.classList.remove('show');return}\n", "")
          for bad in ['UNDO_KEY','stashUndo(','showUndo(','confirm-undo','uxUndo','extraMin=','>额外复习<',":'额外复习'"]:
              if bad in s:
                  raise SystemExit(f'residual runtime token: {bad}')
          runtime.write_text(s)

          css = Path('xizong-study/styles.css')
          c = css.read_text()
          c = c.replace('.ux-stats4{grid-template-columns:repeat(2,minmax(0,1fr))}', '.ux-stats3{grid-template-columns:repeat(2,minmax(0,1fr))}')
          c = c.replace('.ux-toast,.ux-undo{', '.ux-toast{').replace('.ux-toast.show,.ux-undo.show{', '.ux-toast.show{')
          c = re.sub(r'\.ux-undo button\{[^}]*\}', '', c)
          c = c.replace('@media(min-width:700px){.ux-stats4{grid-template-columns:repeat(4,minmax(0,1fr))}}', '@media(min-width:700px){.ux-stats3{grid-template-columns:repeat(3,minmax(0,1fr))}}')
          if 'ux-undo' in c or 'ux-stats4' in c:
              raise SystemExit('legacy undo/stats css remains')
          css.write_text(c)

          index = Path('xizong-study/index.html')
          h = index.read_text().replace('styles.css?v=39','styles.css?v=40').replace('integrated-runtime.js?v=46','integrated-runtime.js?v=47')
          index.write_text(h)

          sw = Path('xizong-study/sw.js')
          w = sw.read_text().replace("xizong-study-v46-20260830", "xizong-study-v47-20260830").replace("styles.css?v=39", "styles.css?v=40").replace("integrated-runtime.js?v=46", "integrated-runtime.js?v=47")
          sw.write_text(w)

          import subprocess
          subprocess.run(['node','--check','xizong-study/integrated-runtime.js'], check=True)
          subprocess.run(['node','--check','xizong-study/app.js'], check=True)
          for path in [runtime, css, index, sw]:
              print(path, path.stat().st_size)
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add xizong-study/integrated-runtime.js xizong-study/styles.css xizong-study/index.html xizong-study/sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove extra review stats and undo prompts"
          git push
