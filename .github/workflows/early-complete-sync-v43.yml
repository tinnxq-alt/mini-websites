name: Early complete sync v43

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/early-complete-sync-v43.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sync tomorrow early completion into today tasks
        shell: python
        run: |
          from pathlib import Path

          p=Path('xizong-study/integrated-runtime.js')
          s=p.read_text(encoding='utf-8')

          old="function completeInitial(taskId){const state=read(),task=(state?.tasks||[]).find(t=>t.id===taskId&&t.type==='rolling'&&t.rollingInitial);if(!state||!task)return;task.done=true;syncLinkedTasks(state);write(state);sessionStorage.setItem('ux-restore-view','rolling');location.reload()}"
          new=old+"\nfunction earlyCompleteInitial(taskId){const state=read(),task=(state?.tasks||[]).find(t=>t.id===taskId&&t.type==='rolling'&&t.rollingInitial),item=task?findItem(state,task.rollingId):null;if(!state||!task||!item)return;task.uxEarlyCompletedFrom=task.date;task.date=today();task.done=true;syncLinkedTasks(state);write(state);sessionStorage.setItem('ux-restore-view','rolling');location.reload()}\nfunction ensureEarlyCompletedTask(state,item,node){let task=(state.tasks||[]).find(t=>t.type==='rolling'&&t.rollingId===item.id&&Number(t.rollingIndex)===Number(node.index));if(task){task.uxEarlyCompletedFrom=task.date||node.date;task.date=today();task.done=true;return task}task={id:uid('rolltask'),date:today(),type:'rolling',name:`滚动复习 · ${item.name}`,subject:item.subject||'综合',done:true,auto:false,rollingAuto:true,rollingId:item.id,rollingIndex:Number(node.index),order:80,uxEarlyCompletedFrom:node.date};state.tasks=Array.isArray(state.tasks)?state.tasks:[];state.tasks.push(task);return task}\nfunction earlyCompleteOne(id,index){const state=read(),item=findItem(state,id),node=findNode(item,index);if(!state||!item||!node)return;const raw=prompt('本次复习用时（分钟，可留空）','');if(raw===null)return;const minutes=Math.max(0,Number(raw)||0);node.status='done';node.completedAt=new Date().toISOString();node.minutes=minutes;rollingRecord(state,item,node,minutes);ensureEarlyCompletedTask(state,item,node);write(state);sessionStorage.setItem('ux-restore-view','rolling');location.reload()}"
          assert old in s, 'completeInitial marker missing'
          s=s.replace(old,new,1)

          old="if(!row.querySelector('.ux-task-status')){const s=node?dueLabel(node.date):dueLabel(task.date),badge=document.createElement('span');badge.className=`ux-task-status ux-status ${s.cls}`;badge.textContent=s.text;row.querySelector('.task')?.insertBefore(badge,row.querySelector('[data-a=\"start-task\"], [data-a=\"record\"]')||null)}"
          new="if(!row.querySelector('.ux-task-status')){const s=task.done&&task.uxEarlyCompletedFrom?{text:'已完成',cls:'done'}:node?dueLabel(node.date):dueLabel(task.date),badge=document.createElement('span');badge.className=`ux-task-status ux-status ${s.cls}`;badge.textContent=s.text;row.querySelector('.task')?.insertBefore(badge,row.querySelector('[data-a=\"start-task\"], [data-a=\"record\"]')||null)}"
          assert old in s, 'today rolling status marker missing'
          s=s.replace(old,new,1)

          old="if(ux==='complete-initial'||ux==='early-complete-initial')return completeInitial(uxEl.dataset.taskId);\n    if(ux==='complete-one'||ux==='early-complete-one')return mutateOne('complete',uxEl.dataset.id,uxEl.dataset.index);"
          new="if(ux==='complete-initial')return completeInitial(uxEl.dataset.taskId);if(ux==='early-complete-initial')return earlyCompleteInitial(uxEl.dataset.taskId);\n    if(ux==='complete-one')return mutateOne('complete',uxEl.dataset.id,uxEl.dataset.index);if(ux==='early-complete-one')return earlyCompleteOne(uxEl.dataset.id,uxEl.dataset.index);"
          assert old in s, 'early handler marker missing'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('xizong-study/index.html')
          s=p.read_text(encoding='utf-8').replace('integrated-runtime.js?v=42','integrated-runtime.js?v=43')
          p.write_text(s,encoding='utf-8')

          p=Path('xizong-study/sw.js')
          s=p.read_text(encoding='utf-8').replace('xizong-study-v42-20260830','xizong-study-v43-20260830').replace('integrated-runtime.js?v=42','integrated-runtime.js?v=43')
          p.write_text(s,encoding='utf-8')

      - name: Validate
        run: |
          node --check xizong-study/integrated-runtime.js
          grep -q "function earlyCompleteInitial" xizong-study/integrated-runtime.js
          grep -q "function earlyCompleteOne" xizong-study/integrated-runtime.js
          grep -q "function ensureEarlyCompletedTask" xizong-study/integrated-runtime.js
          grep -q "task.uxEarlyCompletedFrom" xizong-study/integrated-runtime.js
          grep -q "text:'已完成',cls:'done'" xizong-study/integrated-runtime.js
          grep -q 'integrated-runtime.js?v=43' xizong-study/index.html
          grep -q 'xizong-study-v43-20260830' xizong-study/sw.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/integrated-runtime.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Sync early rolling completion into today tasks"
          git push
