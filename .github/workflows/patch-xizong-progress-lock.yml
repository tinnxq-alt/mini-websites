name: Patch Xizong progress lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-xizong-progress-lock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lock subject progress until edit
        shell: python
        run: |
          from pathlib import Path

          p = Path('xizong-study/app.js')
          s = p.read_text(encoding='utf-8')

          old = '<div class="section"><h2>学科进度</h2><span class="small muted">拖动修改</span></div>'
          new = '<div class="section"><h2>学科进度</h2><button type="button" onclick="document.querySelectorAll(\'.prog-range\').forEach(x=>x.disabled=false);this.disabled=true;this.textContent=\'修改中\'">修改进度</button></div>'
          if old not in s:
            raise SystemExit('subject progress header not found')
          s = s.replace(old, new, 1)

          old_range = 'class="prog-range" data-subject="${s}" type="range" min="0" max="100" step="1" value="${state.subjectProgress[s]||0}"'
          new_range = 'class="prog-range" data-subject="${s}" type="range" min="0" max="100" step="1" value="${state.subjectProgress[s]||0}" disabled'
          if old_range not in s:
            raise SystemExit('progress range input not found')
          s = s.replace(old_range, new_range, 1)

          old_badge = '<span class="badge">PWA v11</span>'
          if old_badge in s:
            s = s.replace(old_badge, '<span class="badge">PWA v12</span>', 1)

          p.write_text(s, encoding='utf-8')

          idx = Path('xizong-study/index.html')
          h = idx.read_text(encoding='utf-8')
          h = h.replace('./styles.css?v=11','./styles.css?v=12').replace('./app.js?v=11','./app.js?v=12')
          idx.write_text(h, encoding='utf-8')

          sw = Path('xizong-study/sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('xizong-study-v11-20260829','xizong-study-v12-20260829')
          w = w.replace('./styles.css?v=11','./styles.css?v=12').replace('./app.js?v=11','./app.js?v=12')
          sw.write_text(w, encoding='utf-8')
      - name: Verify
        run: |
          node --check xizong-study/app.js
          grep -q '>修改进度</button>' xizong-study/app.js
          grep -q 'prog-range.*disabled' xizong-study/app.js
          grep -q 'app.js?v=12' xizong-study/index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/app.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Lock Xizong subject progress until edit"
          git push
