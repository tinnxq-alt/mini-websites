name: Cleanup CSS v39

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-css-v39.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Merge legacy CSS and remove deprecated files
        shell: python
        run: |
          from pathlib import Path

          root=Path('xizong-study')
          styles=root/'styles.css'
          timer=root/'timer.css'
          power=root/'powerups.css'
          s=styles.read_text(encoding='utf-8').rstrip()+"\n\n/* Timer styles (merged from legacy timer.css) */\n"+timer.read_text(encoding='utf-8').strip()+"\n\n/* Runtime enhancement styles (merged from legacy powerups.css) */\n"+power.read_text(encoding='utf-8').strip()+"\n"
          styles.write_text(s,encoding='utf-8')
          timer.unlink()
          power.unlink()

          idx=root/'index.html'
          s=idx.read_text(encoding='utf-8')
          s=s.replace('<link rel="stylesheet" href="./styles.css?v=36">\n<link rel="stylesheet" href="./timer.css?v=16">\n<link rel="stylesheet" href="./powerups.css?v=22">','<link rel="stylesheet" href="./styles.css?v=39">')
          idx.write_text(s,encoding='utf-8')

          sw=root/'sw.js'
          s=sw.read_text(encoding='utf-8')
          s=s.replace("xizong-study-v38-20260830","xizong-study-v39-20260830")
          s=s.replace("'./styles.css?v=36','./timer.css?v=16','./powerups.css?v=22'","'./styles.css?v=39'")
          sw.write_text(s,encoding='utf-8')

      - name: Validate cleaned site
        run: |
          node --check xizong-study/app.js
          node --check xizong-study/integrated-runtime.js
          test ! -e xizong-study/timer.css
          test ! -e xizong-study/powerups.css
          grep -q 'styles.css?v=39' xizong-study/index.html
          ! grep -q 'timer.css' xizong-study/index.html
          ! grep -q 'powerups.css' xizong-study/index.html
          grep -q 'timer-mode-grid' xizong-study/styles.css
          grep -q 'ux-timer-bar' xizong-study/styles.css
          grep -q 'xizong-study-v39-20260830' xizong-study/sw.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/styles.css xizong-study/index.html xizong-study/sw.js xizong-study/timer.css xizong-study/powerups.css
          git commit -m "Merge legacy CSS and remove deprecated files"
          git push
