name: Resume without undo v37

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resume-without-undo-v37.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove undo prompt when resuming rolling project
        shell: python
        run: |
          from pathlib import Path
          rt=Path('xizong-study/integrated-runtime.js')
          s=rt.read_text(encoding='utf-8')
          old="function togglePause(id){const state=read(),item=findItem(state,id);if(!item)return;stashUndo(item.paused?'已恢复滚动':'已暂停滚动');item.paused=!item.paused;if(item.paused)state.tasks=(state.tasks||[]).filter(t=>!(t.type==='rolling'&&t.rollingId===id&&!t.done));else ensureDueTasks(state);write(state);sessionStorage.setItem('ux-restore-view','rolling');location.reload()}"
          new="function togglePause(id){const state=read(),item=findItem(state,id);if(!item)return;const wasPaused=!!item.paused;if(!wasPaused)stashUndo('已暂停滚动');else sessionStorage.removeItem(UNDO_KEY);item.paused=!wasPaused;if(item.paused)state.tasks=(state.tasks||[]).filter(t=>!(t.type==='rolling'&&t.rollingId===id&&!t.done));else ensureDueTasks(state);write(state);sessionStorage.setItem('ux-restore-view','rolling');location.reload()}"
          assert old in s, 'togglePause block not found'
          s=s.replace(old,new,1)
          s=s.replace("['滚动项目已删除','已暂停滚动','已恢复滚动'].includes(p.label)","['滚动项目已删除','已暂停滚动'].includes(p.label)",1)
          rt.write_text(s,encoding='utf-8')

          idx=Path('xizong-study/index.html')
          s=idx.read_text(encoding='utf-8').replace('integrated-runtime.js?v=36','integrated-runtime.js?v=37')
          idx.write_text(s,encoding='utf-8')

          sw=Path('xizong-study/sw.js')
          s=sw.read_text(encoding='utf-8').replace('xizong-study-v36-20260830','xizong-study-v37-20260830').replace('integrated-runtime.js?v=36','integrated-runtime.js?v=37')
          sw.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          node --check xizong-study/integrated-runtime.js
          grep -q "if(!wasPaused)stashUndo('已暂停滚动')" xizong-study/integrated-runtime.js
          grep -q "else sessionStorage.removeItem(UNDO_KEY)" xizong-study/integrated-runtime.js
          ! grep -q "stashUndo(item.paused?'已恢复滚动':'已暂停滚动')" xizong-study/integrated-runtime.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/integrated-runtime.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Remove undo prompt when resuming rolling project"
          git push
