name: Fix in-place pause v40

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-inplace-pause-v40.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Synchronize pause state without page reload
        shell: python
        run: |
          from pathlib import Path

          app=Path('xizong-study/app.js')
          s=app.read_text(encoding='utf-8')
          marker="function save(){state.version=V;localStorage.setItem(STORE_KEY,JSON.stringify(state));try{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('state'))r.result.createObjectStore('state')};r.onsuccess=()=>{const tx=r.result.transaction('state','readwrite');tx.objectStore('state').put(clone(state),'main')}}catch{}}"
          assert marker in s, 'save marker missing'
          if 'window.__xizongSyncState' not in s:
            s=s.replace(marker,marker+"\nwindow.__xizongSyncState=next=>{if(next)state=normalize(next)};window.__xizongRefreshTimer=()=>updateTimerUI();",1)

          old="function updateTimerUI(){const timer=state.activeTimer;if(!timer)return;const t=state.tasks.find(x=>x.id===timer.taskId);if($('#timerTitle')&&timerTaskId===timer.taskId)$('#timerTitle').textContent=t?.name||'学习计时';const elapsed=timerElapsedSeconds(timer),remain=timerRemainingSeconds(timer);if($('#timerClock'))$('#timerClock').textContent=timer.mode==='down'?formatClock(remain):formatClock(elapsed);if($('#timerModeText'))$('#timerModeText').textContent=timer.mode==='down'?`倒计时 · ${Math.round(timer.durationSec/60)} 分钟`:'正计时';if($('#timerStatus'))$('#timerStatus').textContent=timer.mode==='down'?(remain===0?'时间到，可以完成并记录':'锁屏/切后台后会按真实时间继续计算'):'锁屏/切后台后会按真实时间继续计算';if(timer.mode==='down'&&remain===0&&!timerAlerted){timerAlerted=true;try{navigator.vibrate?.([180,100,180])}catch{}toast('倒计时结束')}refreshTimerButton()}"
          new="function updateTimerUI(){const timer=state.activeTimer;if(!timer)return;const t=state.tasks.find(x=>x.id===timer.taskId);if($('#timerTitle')&&timerTaskId===timer.taskId)$('#timerTitle').textContent=t?.name||'学习计时';const elapsed=timerElapsedSeconds(timer),remain=timerRemainingSeconds(timer);if($('#timerClock'))$('#timerClock').textContent=timer.mode==='down'?formatClock(remain):formatClock(elapsed);if($('#timerModeText'))$('#timerModeText').textContent=timer.mode==='down'?`倒计时 · ${Math.round(timer.durationSec/60)} 分钟`:'正计时';if($('#timerStatus'))$('#timerStatus').textContent=timer.paused?'已暂停；时间已冻结':timer.mode==='down'?(remain===0?'时间到，可以完成并记录':'锁屏/切后台后会按真实时间继续计算'):'锁屏/切后台后会按真实时间继续计算';if(timer.mode==='down'&&!timer.paused&&remain===0&&!timerAlerted){timerAlerted=true;try{navigator.vibrate?.([180,100,180])}catch{}toast('倒计时结束')}refreshTimerButton()}"
          assert old in s, 'updateTimerUI block missing'
          s=s.replace(old,new,1)
          app.write_text(s,encoding='utf-8')

          rt=Path('xizong-study/integrated-runtime.js')
          s=rt.read_text(encoding='utf-8')
          old="function togglePause(id){const state=read(),item=findItem(state,id);if(!item)return;const wasPaused=!!item.paused;if(!wasPaused)stashUndo('已暂停滚动');else sessionStorage.removeItem(UNDO_KEY);item.paused=!wasPaused;if(item.paused)state.tasks=(state.tasks||[]).filter(t=>!(t.type==='rolling'&&t.rollingId===id&&!t.done));else ensureDueTasks(state);write(state);sessionStorage.setItem('ux-restore-view','rolling');location.reload()}"
          new="function togglePause(id){const state=read(),item=findItem(state,id);if(!item)return;const wasPaused=!!item.paused;if(!wasPaused)stashUndo('已暂停滚动');else sessionStorage.removeItem(UNDO_KEY);item.paused=!wasPaused;if(item.paused)state.tasks=(state.tasks||[]).filter(t=>!(t.type==='rolling'&&t.rollingId===id&&!t.done));else ensureDueTasks(state);write(state);window.__xizongSyncState?.(state);refresh(0)}"
          assert old in s, 'togglePause block missing'
          s=s.replace(old,new,1)

          old="function toggleTimerPause(){const state=read(),timer=state?.activeTimer;if(!timer)return;if(!timer.paused){timer.paused=true;timer.pausedAt=Date.now();timer.uxPauseUsed=true;write(state);enhanceTimer();toast('计时已暂停')}else{const delta=Date.now()-Number(timer.pausedAt||Date.now());timer.startedAt=Number(timer.startedAt)+Math.max(0,delta);delete timer.pausedAt;timer.paused=false;write(state);sessionStorage.setItem('ux-reopen-timer','1');location.reload()}}"
          new="function toggleTimerPause(){const state=read(),timer=state?.activeTimer;if(!timer)return;if(!timer.paused){timer.paused=true;timer.pausedAt=Date.now();timer.uxPauseUsed=true}else{const delta=Date.now()-Number(timer.pausedAt||Date.now());timer.startedAt=Number(timer.startedAt)+Math.max(0,delta);delete timer.pausedAt;timer.paused=false}write(state);window.__xizongSyncState?.(state);window.__xizongRefreshTimer?.();enhanceTimer();if(timer.paused)toast('计时已暂停')}"
          assert old in s, 'toggleTimerPause block missing'
          s=s.replace(old,new,1)

          old="  if(a==='rolling-delete'){e.preventDefault();e.stopImmediatePropagation();deleteRollingProject(id);return}\n  \n},true);"
          new="  if(a==='rolling-delete'){e.preventDefault();e.stopImmediatePropagation();deleteRollingProject(id);return}\n  if(a==='toggle-rolling-pause'){e.preventDefault();e.stopImmediatePropagation();togglePause(id);return}\n  \n},true);"
          assert old in s, 'capture routing marker missing'
          s=s.replace(old,new,1)
          s=s.replace("['toggle','rolling-complete','rolling-delay','rolling-skip','toggle-rolling-pause'].includes(a)","['toggle','rolling-complete','rolling-delay','rolling-skip'].includes(a)",1)
          rt.write_text(s,encoding='utf-8')

          idx=Path('xizong-study/index.html')
          s=idx.read_text(encoding='utf-8').replace('integrated-runtime.js?v=38','integrated-runtime.js?v=40').replace('app.js?v=38','app.js?v=40')
          idx.write_text(s,encoding='utf-8')

          sw=Path('xizong-study/sw.js')
          s=sw.read_text(encoding='utf-8').replace('xizong-study-v39-20260830','xizong-study-v40-20260830').replace('integrated-runtime.js?v=38','integrated-runtime.js?v=40').replace('app.js?v=38','app.js?v=40')
          sw.write_text(s,encoding='utf-8')

      - name: Validate
        run: |
          node --check xizong-study/app.js
          node --check xizong-study/integrated-runtime.js
          grep -q 'window.__xizongSyncState' xizong-study/app.js
          grep -q '已暂停；时间已冻结' xizong-study/app.js
          grep -q "window.__xizongSyncState?.(state);refresh(0)" xizong-study/integrated-runtime.js
          grep -q "window.__xizongRefreshTimer?.()" xizong-study/integrated-runtime.js
          grep -q "if(a==='toggle-rolling-pause')" xizong-study/integrated-runtime.js
          grep -q 'integrated-runtime.js?v=40' xizong-study/index.html
          grep -q 'app.js?v=40' xizong-study/index.html
          grep -q 'xizong-study-v40-20260830' xizong-study/sw.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xizong-study/app.js xizong-study/integrated-runtime.js xizong-study/index.html xizong-study/sw.js
          git commit -m "Fix in-place rolling and timer pause state"
          git push
