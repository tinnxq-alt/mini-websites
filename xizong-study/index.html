<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f6f57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="西综作战室">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="stylesheet" href="./styles.css?v=8">
<title>西综作战室</title>
</head>
<body>
<div class="app">
<header class="top"><div><p id="dateText" class="eyebrow"></p><h1>西综作战室</h1></div><button id="installBtn" class="iconbtn hidden" aria-label="安装到桌面">＋</button></header>
<main id="view" class="view"></main>
</div>
<nav id="nav" class="nav">
<button data-view="today" class="active"><span>⌂</span><small>今日</small></button>
<button data-view="plan"><span>▦</span><small>计划</small></button>
<button data-view="records"><span>✓</span><small>记录</small></button>
<button data-view="review"><span>↺</span><small>复盘</small></button>
<button data-view="me"><span>☰</span><small>我的</small></button>
</nav>
<dialog id="recordDialog" class="sheet"><form id="recordForm" class="sheetin"><div class="handle"></div><div class="sheethead"><h3 id="recordTitle">记录学习</h3><button type="button" id="closeRecord" class="iconbtn">×</button></div><input type="hidden" id="recordTaskId"><label>科目<select id="rSubject"></select></label><label>年份<input id="rYear" type="number" min="2000" max="2035"></label><div class="grid2"><label>题数<input id="rTotal" type="number" min="0" inputmode="numeric"></label><label id="correctWrap">正确数<input id="rCorrect" type="number" min="0" inputmode="numeric"></label></div><label>用时（分钟）<input id="rMinutes" type="number" min="0" inputmode="numeric"></label><label>备注<textarea id="rNote" rows="3" placeholder="可选"></textarea></label><button class="btn primary" type="submit">保存记录</button></form></dialog>
<dialog id="taskDialog" class="sheet"><form id="taskForm" class="sheetin"><div class="handle"></div><div class="sheethead"><h3 id="taskTitle">添加任务</h3><button type="button" id="closeTask" class="iconbtn">×</button></div><input type="hidden" id="taskId"><label>任务名称<input id="tName" required></label><label>日期<input id="tDate" type="date" required></label><label>类型<select id="tType"><option value="practice">刷题</option><option value="review">错题复盘</option><option value="mock">套卷</option><option value="study">西综复习（非刷题）</option></select></label><label id="qWrap">题量<input id="tQuestions" type="number" min="0" inputmode="numeric"></label><button class="btn primary" type="submit">保存任务</button></form></dialog>
<div id="toast" class="toast"></div><input id="importFile" class="hidden" type="file" accept="application/json,.json">
<script src="./app.js?v=8"></script>
</body>
</html>
