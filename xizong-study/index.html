<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>西综作战室</title>
<style>
:root{--bg:#f5f7f2;--card:#fff;--ink:#20342b;--muted:#738077;--line:#dde6df;--p:#2f6f57;--ps:#dcece3;--gold:#9a6a2d;--danger:#a64b48;--r:22px;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:640px;margin:auto;min-height:100vh;padding-bottom:calc(82px + var(--safe))}.top{position:sticky;top:0;z-index:8;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 12px;background:rgba(245,247,242,.94);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:12px;color:var(--muted);margin:0 0 2px}.top h1{font-size:22px;margin:0}.view{padding:5px 15px 24px}.card{background:var(--card);border:1px solid rgba(221,230,223,.9);border-radius:var(--r);padding:17px;margin-bottom:13px;box-shadow:0 8px 28px rgba(40,70,55,.07)}.hero{background:linear-gradient(145deg,#2f6f57,#3d8066);color:#fff;padding:21px}.hero .muted{color:rgba(255,255,255,.75)}.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.hero-num{font-size:45px;font-weight:800;line-height:1}.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.15);font-weight:700}.muted{color:var(--muted)}.small{font-size:12px}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.section h2{font-size:18px;margin:0}.linkbtn,.iconbtn{border:0;background:transparent;color:var(--p)}.iconbtn{background:#fff;border-radius:13px;width:38px;height:38px;box-shadow:0 5px 18px rgba(40,70,55,.08);font-size:20px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{display:block;font-size:24px;margin-top:4px}.task-wrap{position:relative;overflow:hidden;touch-action:pan-y}.task-actions{position:absolute;right:0;top:0;bottom:0;width:136px;display:grid;grid-template-columns:1fr 1fr}.task-actions button{border:0;color:#fff;font-weight:700}.edit{background:#638b77}.del{background:var(--danger)}.task{position:relative;z-index:1;background:#fff;display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid var(--line);transition:transform .18s}.task-wrap.open .task{transform:translateX(-136px)}.task-wrap:last-child .task{border-bottom:0}.check{width:27px;height:27px;border:2px solid #b6c8bd;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none;color:#fff}.task.done .check{background:var(--p);border-color:var(--p)}.task.done .title{text-decoration:line-through;color:var(--muted)}.taskmain{flex:1;min-width:0}.title{font-weight:700;margin-bottom:3px}.meta{font-size:12px;color:var(--muted)}.recordbtn{border:0;background:var(--ps);color:var(--p);border-radius:11px;padding:8px 9px;font-size:12px}.progress{height:9px;border-radius:99px;background:#e7eee9;overflow:hidden}.progress i{display:block;height:100%;background:var(--p)}.progrow{display:grid;grid-template-columns:58px 1fr 70px;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}.progrow:last-child{border-bottom:0}.progrow input{padding:9px 8px;text-align:center;font-weight:700}.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--ps);color:var(--p);font-size:12px}.badge.wait{background:#f8eedf;color:var(--gold)}.record{padding:13px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.rhead{display:flex;justify-content:space-between;gap:10px}.score{font-weight:800;color:var(--p)}.shiftgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.shift{border:0;padding:12px 4px;border-radius:15px;background:#edf4ef;color:var(--ink)}.shift.active{background:var(--p);color:#fff}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.day{border:0;border-radius:13px;padding:8px 2px;background:#f0f4f1;font-size:11px;color:var(--ink)}.day b{display:block;font-size:14px;margin:2px 0}.day.today{background:var(--p);color:#fff}.btn{width:100%;min-height:48px;border-radius:16px;padding:11px 14px;font-weight:700}.primary{border:0;background:var(--p);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.danger{color:var(--danger)}input,select,textarea{width:100%;border:1px solid var(--line);background:#fbfcfa;border-radius:13px;padding:11px 12px;outline:none;color:var(--ink)}label{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;z-index:12;bottom:0;left:50%;transform:translateX(-50%);width:min(640px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:7px 4px calc(7px + var(--safe));backdrop-filter:blur(15px)}.nav button{border:0;background:transparent;color:#8a968f;padding:5px 1px;display:flex;flex-direction:column;gap:2px;align-items:center}.nav button span{font-size:19px}.nav button small{font-size:11px}.nav button.active{color:var(--p);font-weight:700}.sheet{border:0;padding:0;width:min(640px,100%);max-width:none;margin:auto auto 0;background:transparent}.sheet::backdrop{background:rgba(25,38,31,.35)}.sheetin{background:#fff;border-radius:27px 27px 0 0;padding:8px 18px calc(22px + var(--safe))}.handle{width:42px;height:5px;background:#d5ddd8;border-radius:99px;margin:2px auto 14px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sheethead h3{margin:0}.empty{text-align:center;color:var(--muted);padding:25px 8px}.toast{position:fixed;z-index:30;left:50%;bottom:calc(90px + var(--safe));transform:translate(-50%,18px);background:#20342b;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}.callout{background:#fffaf1;border-left:4px solid #c8934c;padding:11px 13px;border-radius:4px 14px 14px 4px;color:#6b583e;font-size:13px;margin:10px 0}@media(min-width:641px){body{background:#e9eee9}.app{background:var(--bg)}}
</style>
</head>
<body><div class="app"><header class="top"><div><p class="eyebrow" id="dateText"></p><h1>西综作战室</h1></div><button id="installBtn" class="iconbtn hidden" title="安装">＋</button></header><main id="view" class="view"></main></div>
<nav class="nav" id="nav"><button data-view="today" class="active"><span>◎</span><small>今日</small></button><button data-view="plan"><span>▤</span><small>计划</small></button><button data-view="records"><span>✓</span><small>记录</small></button><button data-view="review"><span>↻</span><small>复盘</small></button><button data-view="me"><span>○</span><small>我的</small></button></nav>
<dialog id="recordDialog" class="sheet"><form id="recordForm" class="sheetin"><div class="handle"></div><div class="sheethead"><h3 id="recordTitle">记录学习</h3><button type="button" class="iconbtn" data-close="recordDialog">×</button></div><input type="hidden" id="recordTaskId"><label>科目<select id="rSubject"></select></label><div class="grid2"><label>题数<input id="rTotal" type="number" min="0" inputmode="numeric" required></label><label id="correctWrap">正确数<input id="rCorrect" type="number" min="0" inputmode="numeric"></label></div><label>用时（分钟）<input id="rMinutes" type="number" min="0" inputmode="numeric"></label><label>备注<textarea id="rNote" rows="2" placeholder="可选"></textarea></label><button class="btn primary" type="submit">保存记录</button></form></dialog>
<dialog id="taskDialog" class="sheet"><form id="taskForm" class="sheetin"><div class="handle"></div><div class="sheethead"><h3 id="taskTitle">编辑任务</h3><button type="button" class="iconbtn" data-close="taskDialog">×</button></div><input type="hidden" id="taskId"><label>日期<input id="tDate" type="date" required></label><label>任务名称<input id="tName" required></label><label>类型<select id="tType"><option value="review">错题复盘</option><option value="practice">今日刷题</option><option value="mock">套卷</option></select></label><label>题量<input id="tQuestions" type="number" min="0" inputmode="numeric"></label><button class="btn primary" type="submit">保存</button></form></dialog>
<div id="toast" class="toast"></div><input id="importFile" type="file" accept="application/json" class="hidden">
<script>
(()=>{
const SUBJECTS=['病理','生化','外科','生理','内科'];
const SHIFTS=['日','夜','出','休'];
const KEY='xizong-study-v7';
const DEFAULT={settings:{examDate:'2026-12-26',targetScore:220,anchor:'2026-08-31',anchorShift:'夜',practiceByShift:{日:35,夜:30,出:20,休:60}},subjectProgress:{病理:0,生化:0,外科:0,生理:0,内科:0},completedMockYears:[],shiftOverrides:{'2026-08-30':'休'},tasks:[],records:[],customizedDates:{}};
let state=load(),view='today',installPrompt=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function clone(x){return JSON.parse(JSON.stringify(x))} function merge(a,b){if(!b||typeof b!=='object')return a;for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=merge(a[k]&&typeof a[k]==='object'?a[k]:{},b[k])}else a[k]=b[k]}return a}
function load(){try{return merge(clone(DEFAULT),JSON.parse(localStorage.getItem(KEY)||'null'))}catch{return clone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));persist();}
function persist(){try{const r=indexedDB.open('xizong-study-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>{const tx=r.result.transaction('state','readwrite');tx.objectStore('state').put(clone(state),'main')}}catch{}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)} function iso(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')} function today(){return iso()}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)} function add(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)} function diff(a,b){return Math.round((parse(a)-parse(b))/86400000)} function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function shiftFor(date){if(state.shiftOverrides[date])return state.shiftOverrides[date];const idx=SHIFTS.indexOf(state.settings.anchorShift);let n=(idx+diff(date,state.settings.anchor))%4;if(n<0)n+=4;return SHIFTS[n]}
function weekStart(date){const d=parse(date),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return iso(d)}
function firstRestOfWeek(date){const s=weekStart(date);for(let i=0;i<7;i++){const x=add(s,i);if(shiftFor(x)==='休')return x}return null}
function currentSubject(){return SUBJECTS.find(s=>(state.subjectProgress[s]||0)<100)||SUBJECTS[SUBJECTS.length-1]}
function nextMockYear(){return Array.from({length:10},(_,i)=>2017+i).find(y=>!state.completedMockYears.includes(y))||2026}
function isMockDay(date){return date===firstRestOfWeek(date)&&!state.completedMockYears.includes(nextMockYear())}
function ensureTasks(date=today()){
 if(state.customizedDates[date])return;
 if(state.tasks.some(t=>t.date===date))return;
 const review={id:uid(),date,type:'review',name:'错题复盘',questions:0,subject:'综合',done:false,auto:true};
 state.tasks.push(review);
 if(isMockDay(date)){const y=nextMockYear();state.tasks.push({id:uid(),date,type:'mock',name:`${y} 年西综套卷`,questions:180,subject:'西综',year:y,done:false,auto:true});}
 else{const s=currentSubject(),q=state.settings.practiceByShift[shiftFor(date)]||30;state.tasks.push({id:uid(),date,type:'practice',name:`今日刷题 · ${s}`,questions:q,subject:s,done:false,auto:true});}
 save();
}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dayStats(date=today()){const rs=state.records.filter(r=>r.date===date);const total=rs.reduce((a,r)=>a+(r.total||0),0);const scored=rs.filter(r=>r.type!=='review');const scoredTotal=scored.reduce((a,r)=>a+(r.total||0),0),correct=scored.reduce((a,r)=>a+(r.correct||0),0);return{total,accuracy:scoredTotal?Math.round(correct/scoredTotal*100):null}}
function longStats(){const rs=state.records.filter(r=>r.type!=='review'),t=rs.reduce((a,r)=>a+(r.total||0),0),c=rs.reduce((a,r)=>a+(r.correct||0),0);return{total:t,acc:t?Math.round(c/t*100):null}}
function taskHTML(t){return `<div class="task-wrap" data-swipe="${t.id}"><div class="task-actions"><button class="edit" data-action="edit-task" data-id="${t.id}">编辑</button><button class="del" data-action="delete-task" data-id="${t.id}">删除</button></div><div class="task ${t.done?'done':''}"><button class="check" data-action="toggle" data-id="${t.id}">${t.done?'✓':''}</button><div class="taskmain"><div class="title">${esc(t.name)}</div><div class="meta">${t.type==='review'?'复盘不计正确率':(t.questions?`建议 ${t.questions} 题`:'')} ${t.year?` · ${t.year}`:''}</div></div><button class="recordbtn" data-action="record" data-id="${t.id}">${t.done?'补记':'记录'}</button></div></div>`}
function weekHTML(){const s=weekStart(today());return `<div class="week">${Array.from({length:7},(_,i)=>{const d=add(s,i),dt=parse(d);return `<button class="day ${d===today()?'today':''}"><span>${['一','二','三','四','五','六','日'][i]}</span><b>${dt.getDate()}</b><span>${shiftFor(d)}</span></button>`}).join('')}</div>`}
function renderToday(){ensureTasks();const ds=dayStats(),remain=Math.max(0,Math.ceil((parse(state.settings.examDate)-parse(today()))/86400000));const tasks=state.tasks.filter(t=>t.date===today());return `<section class="card hero"><div class="hero-row"><div><div class="muted small">距考试</div><div class="hero-num">${remain}</div><div class="muted small">天</div></div><div class="pill">${shiftFor(today())}班</div></div>${weekHTML()}</section><div class="stats"><div class="stat"><span class="muted small">今日总题量</span><b>${ds.total}</b></div><div class="stat"><span class="muted small">今日正确率</span><b>${ds.accuracy==null?'—':ds.accuracy+'%'}</b></div></div><div class="section"><h2>今日任务</h2><button class="linkbtn" data-action="add-task">＋ 添加</button></div><section class="card">${tasks.length?tasks.map(taskHTML).join(''):'<div class="empty">今天没有任务</div>'}</section><section class="card"><div class="small muted">当前推进</div><div style="font-size:20px;font-weight:800;margin:5px 0 10px">${currentSubject()}</div><div class="progress"><i style="width:${state.subjectProgress[currentSubject()]||0}%"></i></div></section>`}
function renderPlan(){return `<div class="section"><h2>学科进度</h2></div><section class="card">${SUBJECTS.map(s=>`<div class="progrow"><b>${s}</b><div class="progress"><i style="width:${state.subjectProgress[s]||0}%"></i></div><input class="pinput" data-subject="${s}" type="number" min="0" max="100" value="${state.subjectProgress[s]||0}" inputmode="numeric"></div>`).join('')}<button class="btn primary" style="margin-top:14px" data-action="save-progress">保存学科进度</button></section><div class="section"><h2>2017–2026 套卷</h2></div><section class="card">${Array.from({length:10},(_,i)=>2017+i).map(y=>`<div class="listrow"><span>${y} 年真题</span><button class="badge ${state.completedMockYears.includes(y)?'':'wait'}" data-action="toggle-mock" data-year="${y}">${state.completedMockYears.includes(y)?'已完成':'待做'}</button></div>`).join('')}</section><div class="callout">每周按排班选择当周第一个「休」日做一套；套卷日不再推送学科刷题，只保留错题复盘 + 套卷。</div>`}
function recordLine(r){const pct=r.type==='review'?null:(r.total?Math.round(r.correct/r.total*100):0);return `<div class="record"><div class="rhead"><div><b>${r.type==='review'?'错题复盘':(r.year?r.year+' 套卷':esc(r.subject))}</b><div class="small muted">${r.date} · ${r.total} 题${r.minutes?' · '+r.minutes+' 分钟':''}</div></div>${pct==null?'<span class="badge">复盘</span>':`<span class="score">${pct}%</span>`}</div>${r.note?`<div class="small muted" style="margin-top:7px">${esc(r.note)}</div>`:''}</div>`}
function renderRecords(){const rs=[...state.records].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));const s=longStats();return `<div class="stats"><div class="stat"><span class="muted small">累计刷题</span><b>${s.total}</b></div><div class="stat"><span class="muted small">刷题正确率</span><b>${s.acc==null?'—':s.acc+'%'}</b></div></div><div class="section"><h2>学习记录</h2></div><section class="card">${rs.length?rs.map(recordLine).join(''):'<div class="empty">还没有刷题记录</div>'}</section>`}
function renderReview(){const rs=[...state.records].filter(r=>r.type==='review').sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `<div class="section"><h2>错题复盘记录</h2></div><section class="card">${rs.length?rs.map(recordLine).join(''):'<div class="empty">完成错题复盘后，在首页点「记录」即可留下复盘题数、用时和备注。</div>'}</section>`}
function renderMe(){return `<div class="section"><h2>排班</h2></div><section class="card"><div class="small muted" style="margin-bottom:10px">今天：${today()}</div><div class="shiftgrid">${SHIFTS.map(s=>`<button class="shift ${shiftFor(today())===s?'active':''}" data-action="set-shift" data-shift="${s}">${s}</button>`).join('')}</div><div class="callout">默认循环：日 → 夜 → 出 → 休；锚点 2026-08-31 = 夜班。单日修改只覆盖当天。</div></section><div class="section"><h2>设置</h2></div><section class="card"><label>考试日期<input id="examDate" type="date" value="${state.settings.examDate}"></label><label>目标分<input id="targetScore" type="number" value="${state.settings.targetScore}"></label><div class="grid2">${SHIFTS.map(s=>`<label>${s}班刷题量<input class="shiftq" data-shift="${s}" type="number" min="0" value="${state.settings.practiceByShift[s]}"></label>`).join('')}</div><button class="btn primary" data-action="save-settings">保存设置</button></section><div class="section"><h2>数据</h2></div><section class="card"><button class="btn secondary" data-action="export">导出备份</button><button class="btn secondary" style="margin-top:10px" data-action="import">导入恢复</button><button class="btn secondary danger" style="margin-top:10px" data-action="reset">清空全部数据</button></section>`}
function render(){document.querySelector('#dateText').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());const map={today:renderToday,plan:renderPlan,records:renderRecords,review:renderReview,me:renderMe};$('#view').innerHTML=map[view]();$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}
function openRecord(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;$('#recordTaskId').value=id;$('#recordTitle').textContent=t.type==='review'?'记录错题复盘':'记录刷题';$('#rSubject').innerHTML=[...SUBJECTS,'西综','综合'].map(s=>`<option ${s===(t.subject||'综合')?'selected':''}>${s}</option>`).join('');$('#rTotal').value=t.questions||'';$('#rCorrect').value='';$('#rMinutes').value=t.type==='mock'?180:'';$('#rNote').value='';$('#correctWrap').classList.toggle('hidden',t.type==='review');$('#recordDialog').showModal()}
function openTask(id){const t=state.tasks.find(x=>x.id===id);$('#taskId').value=t?.id||'';$('#taskTitle').textContent=t?'编辑任务':'添加任务';$('#tDate').value=t?.date||today();$('#tName').value=t?.name||'';$('#tType').value=t?.type||'practice';$('#tQuestions').value=t?.questions||'';$('#taskDialog').showModal()}
function markCustomized(date){state.customizedDates[date]=true}
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]');if(n){view=n.dataset.view;render();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='toggle'){const t=state.tasks.find(x=>x.id===id);if(t){t.done=!t.done;if(t.done&&t.type==='mock'&&t.year&&!state.completedMockYears.includes(t.year))state.completedMockYears.push(t.year);save();render()}}
 if(a==='record')openRecord(id);if(a==='add-task')openTask();if(a==='edit-task')openTask(id);
 if(a==='delete-task'){const t=state.tasks.find(x=>x.id===id);if(t&&confirm(`删除“${t.name}”？`)){markCustomized(t.date);state.tasks=state.tasks.filter(x=>x.id!==id);save();render();toast('已删除')}}
 if(a==='save-progress'){$$('.pinput').forEach(i=>state.subjectProgress[i.dataset.subject]=clamp(Math.round(Number(i.value)||0),0,100));state.tasks=state.tasks.filter(t=>!(t.auto&&t.date===today()&&!t.done));save();render();toast('进度已保存')}
 if(a==='toggle-mock'){const y=Number(b.dataset.year);state.completedMockYears=state.completedMockYears.includes(y)?state.completedMockYears.filter(x=>x!==y):[...state.completedMockYears,y].sort();state.tasks=state.tasks.filter(t=>!(t.auto&&t.date===today()&&!t.done));save();render()}
 if(a==='set-shift'){state.shiftOverrides[today()]=b.dataset.shift;state.tasks=state.tasks.filter(t=>!(t.auto&&t.date===today()&&!t.done));save();render();toast('今日排班已修改')}
 if(a==='save-settings'){state.settings.examDate=$('#examDate').value||state.settings.examDate;state.settings.targetScore=Number($('#targetScore').value)||220;$$('.shiftq').forEach(i=>state.settings.practiceByShift[i.dataset.shift]=Number(i.value)||0);state.tasks=state.tasks.filter(t=>!t.auto||t.done||t.date<today());save();render();toast('设置已保存')}
 if(a==='export'){const blob=new Blob([JSON.stringify({app:'西综作战室',version:7,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download=`西综作战室备份-${today()}.json`;x.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
 if(a==='import')$('#importFile').click();if(a==='reset'&&confirm('确定清空全部学习记录吗？')){state=clone(DEFAULT);save();render();toast('已清空')}
});
document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)document.getElementById(c.dataset.close).close()});
$('#recordForm').addEventListener('submit',e=>{e.preventDefault();const t=state.tasks.find(x=>x.id===$('#recordTaskId').value);if(!t)return;const total=Number($('#rTotal').value)||0,isReview=t.type==='review',correct=isReview?0:Number($('#rCorrect').value)||0;if(!isReview&&correct>total){toast('正确数不能大于题数');return}state.records.push({id:uid(),createdAt:new Date().toISOString(),date:today(),type:t.type,subject:$('#rSubject').value,year:t.year||null,total,correct,minutes:Number($('#rMinutes').value)||0,note:$('#rNote').value.trim()});t.done=true;if(t.type==='mock'&&t.year&&!state.completedMockYears.includes(t.year))state.completedMockYears.push(t.year);save();$('#recordDialog').close();render();toast(isReview?`已记录复盘 ${total} 题`:`已记录，正确率 ${total?Math.round(correct/total*100):0}%`)});
$('#taskForm').addEventListener('submit',e=>{e.preventDefault();const id=$('#taskId').value,vals={date:$('#tDate').value,name:$('#tName').value.trim(),type:$('#tType').value,questions:Number($('#tQuestions').value)||0};if(id){const t=state.tasks.find(x=>x.id===id);if(t){markCustomized(t.date);Object.assign(t,vals,{auto:false});if(t.type!=='mock')delete t.year}}else{markCustomized(vals.date);state.tasks.push({id:uid(),...vals,done:false,auto:false})}save();$('#taskDialog').close();render();toast('任务已保存')});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());state=merge(clone(DEFAULT),p.data||p);save();render();toast('备份已恢复')}catch{toast('文件无法识别')}e.target.value=''});
let sx=0,sy=0,row=null,moved=false;document.addEventListener('touchstart',e=>{const r=e.target.closest('.task-wrap');$$('.task-wrap.open').forEach(x=>{if(x!==r)x.classList.remove('open')});if(!r){row=null;return}const t=e.touches[0];sx=t.clientX;sy=t.clientY;row=r;moved=false},{passive:true});document.addEventListener('touchmove',e=>{if(!row)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){moved=true;e.preventDefault()}},{passive:false});document.addEventListener('touchend',e=>{if(!row)return;const dx=e.changedTouches[0].clientX-sx;if(moved){if(dx<-35)row.classList.add('open');if(dx>25)row.classList.remove('open')}row=null},{passive:true});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').classList.remove('hidden')});$('#installBtn').addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').classList.add('hidden')});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script></body></html>
